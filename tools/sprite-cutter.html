<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精灵切割工具 - Sprite Cutter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --primary: #e94560;
  --secondary: #0f3460;
  --gold: #f5c518;
  --text: #eee;
  --text-dim: #999;
  --success: #4caf50;
  --danger: #f44336;
  --border: #2a2a4a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
h1 { font-size: 1.3rem; }
h2 { font-size: 1.1rem; margin-bottom: 8px; }
h3 { font-size: 0.95rem; color: var(--gold); margin-bottom: 4px; }

/* Layout */
.app {
  display: grid;
  grid-template-columns: 280px 1fr 300px;
  grid-template-rows: auto 1fr;
  height: 100vh;
  gap: 0;
}
.header {
  grid-column: 1 / -1;
  background: var(--surface);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom: 1px solid var(--border);
}
.header h1 { color: var(--gold); }
.header .info { color: var(--text-dim); font-size: 0.85rem; }

/* Left Panel */
.panel-left {
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px;
}
.panel-left section { margin-bottom: 16px; }

/* Center Canvas */
.canvas-area {
  position: relative;
  overflow: auto;
  background: #111;
  cursor: crosshair;
}
.canvas-wrap {
  position: relative;
  display: inline-block;
  transform-origin: 0 0;
}
.canvas-area canvas {
  display: block;
  image-rendering: pixelated;
}
#gridCanvas {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
}
#selectionCanvas {
  position: absolute;
  top: 0; left: 0;
}

/* Right Panel */
.panel-right {
  background: var(--surface);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px;
}

/* Controls */
.ctrl-group {
  margin-bottom: 12px;
}
.ctrl-group label {
  display: block;
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.ctrl-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 6px;
}
input[type="number"], input[type="text"] {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 8px;
  border-radius: 4px;
  width: 70px;
  font-size: 0.85rem;
}
input[type="number"]:focus, input[type="text"]:focus {
  outline: none;
  border-color: var(--primary);
}
.btn {
  background: var(--secondary);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 14px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.8rem;
  white-space: nowrap;
  transition: all 0.15s;
}
.btn:hover { background: var(--primary); border-color: var(--primary); }
.btn-primary { background: var(--primary); border-color: var(--primary); }
.btn-primary:hover { background: #c33050; }
.btn-success { background: var(--success); border-color: var(--success); }
.btn-success:hover { background: #3d9140; }
.btn-gold { background: var(--gold); color: #111; border-color: var(--gold); font-weight: bold; }
.btn-gold:hover { background: #d4a810; }
.btn-sm { padding: 3px 8px; font-size: 0.75rem; }
.btn-block { display: block; width: 100%; text-align: center; }

/* Drop zone */
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 24px 12px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s;
  margin-bottom: 12px;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--primary);
  background: rgba(233,69,96,0.08);
}
.drop-zone p { color: var(--text-dim); font-size: 0.85rem; margin-top: 6px; }
.drop-zone input { display: none; }

/* Checkerboard pattern for transparency */
.checker-bg {
  background-image:
    linear-gradient(45deg, #333 25%, transparent 25%),
    linear-gradient(-45deg, #333 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #333 75%),
    linear-gradient(-45deg, transparent 75%, #333 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
}

/* Preview grid */
.preview-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  max-height: 300px;
  overflow-y: auto;
  padding: 4px;
  background: var(--bg);
  border-radius: 4px;
}
.preview-cell {
  width: 48px;
  height: 48px;
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  image-rendering: pixelated;
}
.preview-cell:hover { border-color: var(--gold); }
.preview-cell canvas {
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}
.preview-cell .cell-idx {
  position: absolute;
  bottom: 0; right: 0;
  font-size: 9px;
  background: rgba(0,0,0,0.7);
  color: var(--text-dim);
  padding: 0 3px;
  border-radius: 3px 0 0 0;
}

/* Big preview */
.big-preview {
  width: 100%;
  aspect-ratio: 1;
  max-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
}
.big-preview canvas {
  max-width: 100%;
  max-height: 100%;
  image-rendering: pixelated;
}

/* Selected list */
.selected-list {
  max-height: 220px;
  overflow-y: auto;
  background: var(--bg);
  border-radius: 4px;
  padding: 4px;
}
.selected-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 6px;
  border-radius: 3px;
  font-size: 0.8rem;
  cursor: pointer;
}
.selected-item:hover { background: var(--secondary); }
.selected-item canvas {
  width: 32px; height: 32px;
  image-rendering: pixelated;
  border: 1px solid var(--border);
  border-radius: 2px;
}
.selected-item .remove {
  margin-left: auto;
  color: var(--danger);
  cursor: pointer;
  font-weight: bold;
}

/* Status bar */
.status-bar {
  font-size: 0.75rem;
  color: var(--text-dim);
  padding: 4px 8px;
  background: rgba(0,0,0,0.3);
  border-radius: 4px;
  margin-top: 8px;
}

/* JSON output */
.json-output {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 0.75rem;
  color: var(--gold);
  max-height: 200px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
  margin-top: 8px;
}

/* Zoom indicator */
.zoom-bar {
  display: flex;
  align-items: center;
  gap: 6px;
}
.zoom-bar span { font-size: 0.8rem; min-width: 40px; text-align: center; }

/* Tooltip */
.tooltip {
  position: absolute;
  background: rgba(0,0,0,0.85);
  color: var(--text);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 0.75rem;
  pointer-events: none;
  z-index: 100;
  white-space: nowrap;
}

/* Mode indicator */
.mode-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 0.75rem;
  font-weight: bold;
}
.mode-grid { background: var(--success); color: #fff; }
.mode-select { background: var(--primary); color: #fff; }
.mode-strip { background: #9c27b0; color: #fff; }

/* Auto-detect result */
.detect-result {
  background: rgba(76,175,80,0.15);
  border: 1px solid var(--success);
  border-radius: 4px;
  padding: 6px 8px;
  font-size: 0.8rem;
  margin-top: 6px;
}

hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 12px 0;
}

/* Keyboard hints */
.kbd {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 0.75rem;
  font-family: monospace;
}
.shortcuts {
  font-size: 0.75rem;
  color: var(--text-dim);
  line-height: 1.8;
}
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <h1>🗡️ 精灵切割工具</h1>
    <span class="info" id="imageInfo">未加载图片</span>
    <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
      <span class="mode-badge mode-grid" id="modeBadge">网格模式</span>
      <div class="zoom-bar">
        <button class="btn btn-sm" onclick="zoomOut()">−</button>
        <span id="zoomLevel">100%</span>
        <button class="btn btn-sm" onclick="zoomIn()">+</button>
        <button class="btn btn-sm" onclick="zoomFit()">适应</button>
      </div>
    </div>
  </div>

  <!-- Left Panel: Controls -->
  <div class="panel-left">
    <!-- File loader -->
    <section>
      <h3>📂 加载图片</h3>
      <div class="drop-zone" id="dropZone">
        <div>📁 拖入图片或点击选择</div>
        <p>支持 PNG / JPG</p>
        <input type="file" id="fileInput" accept="image/*">
      </div>
    </section>

    <hr>

    <!-- Grid settings -->
    <section>
      <h3>📐 网格设置</h3>
      <div class="ctrl-group">
        <div class="ctrl-row">
          <label style="width:60px">单帧宽:</label>
          <input type="number" id="cellW" value="32" min="1">
          <label>px</label>
        </div>
        <div class="ctrl-row">
          <label style="width:60px">单帧高:</label>
          <input type="number" id="cellH" value="32" min="1">
          <label>px</label>
        </div>
        <div class="ctrl-row">
          <label style="width:60px">间距:</label>
          <input type="number" id="cellGap" value="0" min="0">
          <label>px</label>
        </div>
        <div class="ctrl-row">
          <label style="width:60px">偏移X:</label>
          <input type="number" id="offsetX" value="0" min="0">
          <label>px</label>
        </div>
        <div class="ctrl-row">
          <label style="width:60px">偏移Y:</label>
          <input type="number" id="offsetY" value="0" min="0">
          <label>px</label>
        </div>
      </div>
      <div class="ctrl-row">
        <button class="btn btn-primary btn-block" onclick="applyGrid()">应用网格</button>
      </div>
      <div class="ctrl-row">
        <button class="btn btn-block" onclick="autoDetect()">🔍 自动检测网格</button>
      </div>
      <div id="detectResult"></div>
    </section>

    <hr>

    <!-- Mode -->
    <section>
      <h3>🎯 操作模式</h3>
      <div class="ctrl-row">
        <button class="btn" id="btnModeGrid" onclick="setMode('grid')" style="flex:1">网格选取</button>
        <button class="btn" id="btnModeFree" onclick="setMode('free')" style="flex:1">自由框选</button>
      </div>
      <div class="ctrl-row" style="margin-top:6px">
        <button class="btn btn-block" onclick="selectAll()">全选</button>
      </div>
      <div class="ctrl-row">
        <button class="btn btn-block" onclick="selectNonEmpty()">选取非空帧</button>
      </div>
      <div class="ctrl-row">
        <button class="btn btn-block" onclick="clearSelection()">清除选择</button>
      </div>
    </section>

    <hr>

    <!-- Shortcuts -->
    <section>
      <h3>⌨️ 快捷键</h3>
      <div class="shortcuts">
        <span class="kbd">+</span> / <span class="kbd">-</span> 缩放<br>
        <span class="kbd">0</span> 适应窗口<br>
        <span class="kbd">A</span> 全选<br>
        <span class="kbd">D</span> 选取非空帧<br>
        <span class="kbd">Esc</span> 清除选择<br>
        <span class="kbd">Ctrl+S</span> 导出选中<br>
        <span class="kbd">Ctrl+J</span> 导出JSON<br>
      </div>
    </section>
  </div>

  <!-- Center: Canvas -->
  <div class="canvas-area" id="canvasArea">
    <div class="canvas-wrap checker-bg" id="canvasWrap">
      <canvas id="mainCanvas"></canvas>
      <canvas id="gridCanvas"></canvas>
      <canvas id="selectionCanvas"></canvas>
    </div>
    <div class="tooltip" id="tooltip" style="display:none"></div>
  </div>

  <!-- Right Panel: Preview & Export -->
  <div class="panel-right">
    <!-- Big preview -->
    <section>
      <h3>🔎 预览</h3>
      <div class="big-preview checker-bg" id="bigPreview">
        <canvas id="previewCanvas" width="128" height="128"></canvas>
      </div>
      <div class="status-bar" id="cellInfo">悬停网格单元查看预览</div>
    </section>

    <hr>

    <!-- Selection -->
    <section>
      <h3>✅ 已选择 (<span id="selCount">0</span>)</h3>
      <div class="preview-grid" id="selectedGrid"></div>
    </section>

    <hr>

    <!-- Export -->
    <section>
      <h3>📦 导出</h3>
      <div class="ctrl-group">
        <label>导出名前缀:</label>
        <input type="text" id="exportPrefix" value="sprite" style="width:100%">
      </div>
      <div class="ctrl-row">
        <button class="btn btn-gold btn-block" onclick="exportSelected()">💾 导出选中精灵 (PNG)</button>
      </div>
      <div class="ctrl-row">
        <button class="btn btn-success btn-block" onclick="exportJSON()">📋 导出 JSON 图集</button>
      </div>
      <div class="ctrl-row">
        <button class="btn btn-block" onclick="exportSpriteSheet()">🖼️ 导出为新精灵表</button>
      </div>
      <div id="jsonOutput" class="json-output" style="display:none"></div>
    </section>

    <hr>

    <!-- Atlas info for AI -->
    <section>
      <h3>🤖 AI 提示信息</h3>
      <div class="status-bar" id="aiHint">
        加载图片并选择精灵后，这里会生成可复制给 AI 的描述信息。
      </div>
      <button class="btn btn-block" onclick="copyAIHint()" style="margin-top:6px">📋 复制 AI 提示</button>
    </section>
  </div>
</div>

<script>
// ============================================================
// State
// ============================================================
const state = {
  image: null,           // loaded Image element
  imageData: null,       // ImageData from canvas
  fileName: '',
  zoom: 1,
  mode: 'grid',          // 'grid' | 'free'
  grid: { w: 32, h: 32, gap: 0, ox: 0, oy: 0, cols: 0, rows: 0 },
  selected: new Set(),   // set of "row,col" strings
  freeRects: [],         // [{x,y,w,h}] for free mode
  hoverCell: null,       // {row, col}
  isDragging: false,
  dragStart: null,
  dragEnd: null,
};

// ============================================================
// DOM refs
// ============================================================
const $ = id => document.getElementById(id);
const mainCanvas = $('mainCanvas');
const gridCanvas = $('gridCanvas');
const selCanvas  = $('selectionCanvas');
const mainCtx    = mainCanvas.getContext('2d');
const gridCtx    = gridCanvas.getContext('2d');
const selCtx     = selCanvas.getContext('2d');
const previewCanvas = $('previewCanvas');
const previewCtx    = previewCanvas.getContext('2d');

// ============================================================
// File loading
// ============================================================
const dropZone = $('dropZone');
const fileInput = $('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => { if (e.target.files.length) loadFile(e.target.files[0]); });

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      state.image = img;
      state.fileName = file.name.replace(/\.[^.]+$/, '');
      $('exportPrefix').value = state.fileName.replace(/[^a-zA-Z0-9_-]/g, '_');
      initCanvas();
      autoDetect();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function initCanvas() {
  const img = state.image;
  mainCanvas.width = img.width;
  mainCanvas.height = img.height;
  gridCanvas.width = img.width;
  gridCanvas.height = img.height;
  selCanvas.width = img.width;
  selCanvas.height = img.height;

  mainCtx.clearRect(0, 0, img.width, img.height);
  mainCtx.drawImage(img, 0, 0);
  state.imageData = mainCtx.getImageData(0, 0, img.width, img.height);

  $('imageInfo').textContent = `${state.fileName} — ${img.width}×${img.height}px`;

  state.selected.clear();
  updateSelectedUI();
  zoomFit();
}

// ============================================================
// Zoom
// ============================================================
function setZoom(z) {
  state.zoom = Math.max(0.25, Math.min(z, 16));
  const wrap = $('canvasWrap');
  wrap.style.transform = `scale(${state.zoom})`;
  $('zoomLevel').textContent = Math.round(state.zoom * 100) + '%';
}
function zoomIn() { setZoom(state.zoom * 1.5); }
function zoomOut() { setZoom(state.zoom / 1.5); }
function zoomFit() {
  if (!state.image) return;
  const area = $('canvasArea');
  const zx = (area.clientWidth - 20) / state.image.width;
  const zy = (area.clientHeight - 20) / state.image.height;
  setZoom(Math.min(zx, zy, 4));
}

// ============================================================
// Grid
// ============================================================
function applyGrid() {
  const g = state.grid;
  g.w   = parseInt($('cellW').value) || 32;
  g.h   = parseInt($('cellH').value) || 32;
  g.gap = parseInt($('cellGap').value) || 0;
  g.ox  = parseInt($('offsetX').value) || 0;
  g.oy  = parseInt($('offsetY').value) || 0;

  if (!state.image) return;
  const step_x = g.w + g.gap;
  const step_y = g.h + g.gap;
  g.cols = Math.floor((state.image.width  - g.ox + g.gap) / step_x);
  g.rows = Math.floor((state.image.height - g.oy + g.gap) / step_y);

  state.selected.clear();
  drawGrid();
  drawSelection();
  updateSelectedUI();
}

function drawGrid() {
  const g = state.grid;
  const w = gridCanvas.width, h = gridCanvas.height;
  gridCtx.clearRect(0, 0, w, h);
  if (!state.image || g.cols === 0) return;

  gridCtx.strokeStyle = 'rgba(233,69,96,0.5)';
  gridCtx.lineWidth = 1;

  for (let r = 0; r <= g.rows; r++) {
    const y = g.oy + r * (g.h + g.gap);
    gridCtx.beginPath();
    gridCtx.moveTo(g.ox, y + 0.5);
    gridCtx.lineTo(g.ox + g.cols * (g.w + g.gap) - g.gap, y + 0.5);
    gridCtx.stroke();
  }
  for (let c = 0; c <= g.cols; c++) {
    const x = g.ox + c * (g.w + g.gap);
    gridCtx.beginPath();
    gridCtx.moveTo(x + 0.5, g.oy);
    gridCtx.lineTo(x + 0.5, g.oy + g.rows * (g.h + g.gap) - g.gap);
    gridCtx.stroke();
  }
}

// ============================================================
// Auto-detect grid
// ============================================================
function autoDetect() {
  if (!state.image || !state.imageData) return;
  const data = state.imageData.data;
  const w = state.image.width;
  const h = state.image.height;

  // Try common sizes
  const candidates = [16, 24, 32, 48, 64, 100, 128, 256];
  let bestSize = null;
  let bestScore = -1;

  for (const sz of candidates) {
    // Check if width and height are divisible
    if (w % sz === 0 || h % sz === 0) {
      const cols = Math.floor(w / sz);
      const rows = Math.floor(h / sz);

      // Check transparency at grid lines
      let score = 0;
      // Check vertical lines between cells
      for (let c = 1; c < cols; c++) {
        const x = c * sz;
        let transparent = 0;
        for (let y = 0; y < h; y += 4) {
          if (data[(y * w + x) * 4 + 3] < 10) transparent++;
        }
        score += transparent / (h / 4);
      }
      // Normalize
      if (cols > 1) score /= (cols - 1);

      // Prefer sizes that give reasonable grid counts
      if (cols >= 2 && rows >= 1 && cols <= 100 && rows <= 100) {
        score += 0.1;
      }
      // Prefer common RPG sizes
      if (sz === 32 || sz === 64 || sz === 100) score += 0.05;

      if (score > bestScore) {
        bestScore = score;
        bestSize = sz;
      }
    }
  }

  // Also try to detect by scanning for transparent gaps
  const gapResult = detectByGaps(data, w, h);

  let detectedW, detectedH;
  if (gapResult && gapResult.score > bestScore) {
    detectedW = gapResult.w;
    detectedH = gapResult.h;
  } else if (bestSize) {
    detectedW = bestSize;
    detectedH = bestSize;
  } else {
    // Strip mode: single row
    detectedW = h;
    detectedH = h;
  }

  // Special case: if height < width/3, it's probably a strip
  if (h < w / 3) {
    detectedH = h;
    detectedW = h; // assume square frames
    // Refine: check if w is divisible
    for (const d of [h, Math.round(h * 1.0)]) {
      if (w % d === 0) { detectedW = d; break; }
    }
  }

  $('cellW').value = detectedW;
  $('cellH').value = detectedH;
  $('cellGap').value = 0;
  $('offsetX').value = 0;
  $('offsetY').value = 0;

  applyGrid();

  const g = state.grid;
  $('detectResult').innerHTML = `<div class="detect-result">
    ✅ 检测到: <b>${detectedW}×${detectedH}</b>px，
    ${g.cols}列 × ${g.rows}行 = ${g.cols * g.rows} 帧
  </div>`;
}

function detectByGaps(data, w, h) {
  // Find columns that are mostly transparent
  const colAlpha = new Float32Array(w);
  for (let x = 0; x < w; x++) {
    let sum = 0;
    for (let y = 0; y < h; y++) {
      sum += data[(y * w + x) * 4 + 3];
    }
    colAlpha[x] = sum / h;
  }

  // Find row alpha
  const rowAlpha = new Float32Array(h);
  for (let y = 0; y < h; y++) {
    let sum = 0;
    for (let x = 0; x < w; x++) {
      sum += data[(y * w + x) * 4 + 3];
    }
    rowAlpha[y] = sum / w;
  }

  // Find gaps (columns with very low alpha)
  const threshold = 5;
  const colGaps = findGaps(colAlpha, threshold);
  const rowGaps = findGaps(rowAlpha, threshold);

  if (colGaps.length >= 2) {
    // Detect cell width from gap spacing
    const diffs = [];
    for (let i = 1; i < colGaps.length; i++) {
      diffs.push(colGaps[i] - colGaps[i - 1]);
    }
    const cellW = mode(diffs);

    let cellH = h;
    if (rowGaps.length >= 2) {
      const rDiffs = [];
      for (let i = 1; i < rowGaps.length; i++) {
        rDiffs.push(rowGaps[i] - rowGaps[i - 1]);
      }
      cellH = mode(rDiffs);
    }

    return { w: cellW, h: cellH, score: 1.5 };
  }

  return null;
}

function findGaps(arr, threshold) {
  const gaps = [];
  let inGap = false;
  let gapStart = 0;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] < threshold) {
      if (!inGap) { gapStart = i; inGap = true; }
    } else {
      if (inGap) {
        gaps.push(Math.floor((gapStart + i) / 2));
        inGap = false;
      }
    }
  }
  return gaps;
}

function mode(arr) {
  const freq = {};
  arr.forEach(v => { freq[v] = (freq[v] || 0) + 1; });
  let best = arr[0], bestCount = 0;
  for (const [v, c] of Object.entries(freq)) {
    if (c > bestCount) { bestCount = c; best = parseInt(v); }
  }
  return best;
}

// ============================================================
// Selection
// ============================================================
function cellKey(r, c) { return r + ',' + c; }

function toggleCell(row, col) {
  const key = cellKey(row, col);
  if (state.selected.has(key)) {
    state.selected.delete(key);
  } else {
    state.selected.add(key);
  }
  drawSelection();
  updateSelectedUI();
}

function selectAll() {
  const g = state.grid;
  for (let r = 0; r < g.rows; r++) {
    for (let c = 0; c < g.cols; c++) {
      state.selected.add(cellKey(r, c));
    }
  }
  drawSelection();
  updateSelectedUI();
}

function selectNonEmpty() {
  if (!state.imageData) return;
  const g = state.grid;
  const data = state.imageData.data;
  const imgW = state.image.width;
  state.selected.clear();

  for (let r = 0; r < g.rows; r++) {
    for (let c = 0; c < g.cols; c++) {
      const sx = g.ox + c * (g.w + g.gap);
      const sy = g.oy + r * (g.h + g.gap);
      if (isCellNonEmpty(data, imgW, sx, sy, g.w, g.h)) {
        state.selected.add(cellKey(r, c));
      }
    }
  }
  drawSelection();
  updateSelectedUI();
}

function isCellNonEmpty(data, imgW, sx, sy, w, h) {
  // Sample pixels to check if cell has content (not fully transparent)
  const step = Math.max(1, Math.floor(Math.min(w, h) / 8));
  for (let y = sy; y < sy + h; y += step) {
    for (let x = sx; x < sx + w; x += step) {
      const idx = (y * imgW + x) * 4 + 3; // alpha channel
      if (data[idx] > 10) return true;
    }
  }
  return false;
}

function clearSelection() {
  state.selected.clear();
  drawSelection();
  updateSelectedUI();
}

function drawSelection() {
  const g = state.grid;
  selCtx.clearRect(0, 0, selCanvas.width, selCanvas.height);

  // Draw hover highlight
  if (state.hoverCell) {
    const { row, col } = state.hoverCell;
    const x = g.ox + col * (g.w + g.gap);
    const y = g.oy + row * (g.h + g.gap);
    selCtx.fillStyle = 'rgba(245,197,24,0.2)';
    selCtx.fillRect(x, y, g.w, g.h);
    selCtx.strokeStyle = 'rgba(245,197,24,0.8)';
    selCtx.lineWidth = 2;
    selCtx.strokeRect(x + 1, y + 1, g.w - 2, g.h - 2);
  }

  // Draw selected cells
  for (const key of state.selected) {
    const [r, c] = key.split(',').map(Number);
    const x = g.ox + c * (g.w + g.gap);
    const y = g.oy + r * (g.h + g.gap);
    selCtx.fillStyle = 'rgba(76,175,80,0.25)';
    selCtx.fillRect(x, y, g.w, g.h);
    selCtx.strokeStyle = 'rgba(76,175,80,0.9)';
    selCtx.lineWidth = 2;
    selCtx.strokeRect(x + 1, y + 1, g.w - 2, g.h - 2);

    // Checkmark
    selCtx.fillStyle = 'rgba(76,175,80,0.9)';
    selCtx.font = `${Math.min(g.w, g.h) * 0.4}px sans-serif`;
    selCtx.textAlign = 'center';
    selCtx.textBaseline = 'middle';
    selCtx.fillText('✓', x + g.w / 2, y + g.h / 2);
  }

  // Draw free-selection rectangles
  if (state.isDragging && state.dragStart && state.dragEnd && state.mode === 'free') {
    const x = Math.min(state.dragStart.x, state.dragEnd.x);
    const y = Math.min(state.dragStart.y, state.dragEnd.y);
    const w = Math.abs(state.dragEnd.x - state.dragStart.x);
    const h = Math.abs(state.dragEnd.y - state.dragStart.y);
    selCtx.strokeStyle = 'rgba(233,69,96,0.9)';
    selCtx.lineWidth = 2;
    selCtx.setLineDash([5, 3]);
    selCtx.strokeRect(x, y, w, h);
    selCtx.setLineDash([]);
    selCtx.fillStyle = 'rgba(233,69,96,0.15)';
    selCtx.fillRect(x, y, w, h);
  }

  for (const rect of state.freeRects) {
    selCtx.strokeStyle = 'rgba(76,175,80,0.9)';
    selCtx.lineWidth = 2;
    selCtx.strokeRect(rect.x, rect.y, rect.w, rect.h);
    selCtx.fillStyle = 'rgba(76,175,80,0.15)';
    selCtx.fillRect(rect.x, rect.y, rect.w, rect.h);
  }
}

// ============================================================
// Mouse interaction on canvas
// ============================================================
selCanvas.addEventListener('mousemove', e => {
  if (!state.image) return;
  const rect = selCanvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / state.zoom;
  const y = (e.clientY - rect.top) / state.zoom;

  if (state.mode === 'grid') {
    const g = state.grid;
    const col = Math.floor((x - g.ox) / (g.w + g.gap));
    const row = Math.floor((y - g.oy) / (g.h + g.gap));

    // Check if within cell bounds (not in gap)
    const cellX = g.ox + col * (g.w + g.gap);
    const cellY = g.oy + row * (g.h + g.gap);
    if (col >= 0 && col < g.cols && row >= 0 && row < g.rows
        && x >= cellX && x < cellX + g.w && y >= cellY && y < cellY + g.h) {
      state.hoverCell = { row, col };
      updatePreview(row, col);
      $('cellInfo').textContent = `单元 [${row}, ${col}] — 位置: (${cellX}, ${cellY}) — ${g.w}×${g.h}px`;

      // Show tooltip
      const tip = $('tooltip');
      tip.textContent = `[${row},${col}] ${g.w}×${g.h}`;
      tip.style.display = 'block';
      tip.style.left = (e.clientX - $('canvasArea').getBoundingClientRect().left + 12) + 'px';
      tip.style.top = (e.clientY - $('canvasArea').getBoundingClientRect().top - 8) + 'px';
    } else {
      state.hoverCell = null;
      $('tooltip').style.display = 'none';
    }

    // Drag to select multiple cells
    if (state.isDragging && state.hoverCell) {
      const key = cellKey(row, col);
      if (state.dragAddMode) {
        state.selected.add(key);
      } else {
        state.selected.delete(key);
      }
      updateSelectedUI();
    }

    drawSelection();
  } else if (state.mode === 'free' && state.isDragging) {
    state.dragEnd = { x: Math.round(x), y: Math.round(y) };
    drawSelection();
    const w = Math.abs(state.dragEnd.x - state.dragStart.x);
    const h = Math.abs(state.dragEnd.y - state.dragStart.y);
    $('cellInfo').textContent = `框选: ${w}×${h}px`;
  }
});

selCanvas.addEventListener('mouseleave', () => {
  state.hoverCell = null;
  $('tooltip').style.display = 'none';
  drawSelection();
});

selCanvas.addEventListener('mousedown', e => {
  if (!state.image) return;
  const rect = selCanvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / state.zoom;
  const y = (e.clientY - rect.top) / state.zoom;

  if (state.mode === 'grid' && state.hoverCell) {
    const key = cellKey(state.hoverCell.row, state.hoverCell.col);
    state.isDragging = true;
    state.dragAddMode = !state.selected.has(key);
    toggleCell(state.hoverCell.row, state.hoverCell.col);
  } else if (state.mode === 'free') {
    state.isDragging = true;
    state.dragStart = { x: Math.round(x), y: Math.round(y) };
    state.dragEnd = { x: Math.round(x), y: Math.round(y) };
  }
});

window.addEventListener('mouseup', () => {
  if (state.isDragging && state.mode === 'free' && state.dragStart && state.dragEnd) {
    const x = Math.min(state.dragStart.x, state.dragEnd.x);
    const y = Math.min(state.dragStart.y, state.dragEnd.y);
    const w = Math.abs(state.dragEnd.x - state.dragStart.x);
    const h = Math.abs(state.dragEnd.y - state.dragStart.y);
    if (w > 2 && h > 2) {
      state.freeRects.push({ x, y, w, h });
      updateSelectedUI();
    }
  }
  state.isDragging = false;
  drawSelection();
});

// ============================================================
// Preview
// ============================================================
function updatePreview(row, col) {
  const g = state.grid;
  const sx = g.ox + col * (g.w + g.gap);
  const sy = g.oy + row * (g.h + g.gap);

  const size = Math.max(g.w, g.h);
  previewCanvas.width = g.w;
  previewCanvas.height = g.h;
  previewCtx.clearRect(0, 0, g.w, g.h);
  previewCtx.drawImage(state.image, sx, sy, g.w, g.h, 0, 0, g.w, g.h);
}

// ============================================================
// Selected UI
// ============================================================
function updateSelectedUI() {
  const total = state.selected.size + state.freeRects.length;
  $('selCount').textContent = total;

  const grid = $('selectedGrid');
  grid.innerHTML = '';

  // Grid selections
  const sorted = [...state.selected].sort((a, b) => {
    const [ar, ac] = a.split(',').map(Number);
    const [br, bc] = b.split(',').map(Number);
    return ar !== br ? ar - br : ac - bc;
  });

  sorted.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    const g = state.grid;
    const sx = g.ox + c * (g.w + g.gap);
    const sy = g.oy + r * (g.h + g.gap);

    const cell = document.createElement('div');
    cell.className = 'preview-cell checker-bg';
    cell.title = `[${r},${c}]`;

    const cvs = document.createElement('canvas');
    cvs.width = g.w;
    cvs.height = g.h;
    const ctx = cvs.getContext('2d');
    ctx.drawImage(state.image, sx, sy, g.w, g.h, 0, 0, g.w, g.h);
    cell.appendChild(cvs);

    const idx = document.createElement('span');
    idx.className = 'cell-idx';
    idx.textContent = `${r},${c}`;
    cell.appendChild(idx);

    cell.addEventListener('click', () => {
      state.selected.delete(key);
      drawSelection();
      updateSelectedUI();
    });

    grid.appendChild(cell);
  });

  // Free rects
  state.freeRects.forEach((rect, i) => {
    const cell = document.createElement('div');
    cell.className = 'preview-cell checker-bg';
    cell.title = `自由区域 ${i}: ${rect.w}×${rect.h}`;

    const cvs = document.createElement('canvas');
    cvs.width = rect.w;
    cvs.height = rect.h;
    const ctx = cvs.getContext('2d');
    ctx.drawImage(state.image, rect.x, rect.y, rect.w, rect.h, 0, 0, rect.w, rect.h);
    cell.appendChild(cvs);

    const idx = document.createElement('span');
    idx.className = 'cell-idx';
    idx.textContent = `F${i}`;
    cell.appendChild(idx);

    cell.addEventListener('click', () => {
      state.freeRects.splice(i, 1);
      drawSelection();
      updateSelectedUI();
    });

    grid.appendChild(cell);
  });

  updateAIHint();
}

// ============================================================
// Mode switching
// ============================================================
function setMode(mode) {
  state.mode = mode;
  const badge = $('modeBadge');
  $('btnModeGrid').style.borderColor = mode === 'grid' ? 'var(--primary)' : 'var(--border)';
  $('btnModeFree').style.borderColor = mode === 'free' ? 'var(--primary)' : 'var(--border)';
  if (mode === 'grid') {
    badge.className = 'mode-badge mode-grid';
    badge.textContent = '网格模式';
  } else {
    badge.className = 'mode-badge mode-select';
    badge.textContent = '自由框选';
  }
}

// ============================================================
// Export functions
// ============================================================
function getCropBlob(sx, sy, w, h) {
  const cvs = document.createElement('canvas');
  cvs.width = w;
  cvs.height = h;
  const ctx = cvs.getContext('2d');
  ctx.drawImage(state.image, sx, sy, w, h, 0, 0, w, h);
  return new Promise(resolve => cvs.toBlob(resolve, 'image/png'));
}

function getExportItems() {
  const g = state.grid;
  const prefix = $('exportPrefix').value || 'sprite';
  const items = [];
  let idx = 0;

  const sorted = [...state.selected].sort((a, b) => {
    const [ar, ac] = a.split(',').map(Number);
    const [br, bc] = b.split(',').map(Number);
    return ar !== br ? ar - br : ac - bc;
  });

  for (const key of sorted) {
    const [r, c] = key.split(',').map(Number);
    const sx = g.ox + c * (g.w + g.gap);
    const sy = g.oy + r * (g.h + g.gap);
    items.push({ sx, sy, w: g.w, h: g.h, name: `${prefix}_${String(idx).padStart(3, '0')}.png` });
    idx++;
  }

  for (const rect of state.freeRects) {
    items.push({ sx: rect.x, sy: rect.y, w: rect.w, h: rect.h, name: `${prefix}_free_${String(idx).padStart(3, '0')}.png` });
    idx++;
  }
  return items;
}

async function exportSelected() {
  if (!state.image) return;
  const items = getExportItems();
  if (items.length === 0) return;

  // Single file: direct download
  if (items.length === 1) {
    const blob = await getCropBlob(items[0].sx, items[0].sy, items[0].w, items[0].h);
    const link = document.createElement('a');
    link.download = items[0].name;
    link.href = URL.createObjectURL(blob);
    link.click();
    URL.revokeObjectURL(link.href);
    return;
  }

  // Multiple files: pack into ZIP
  if (typeof JSZip === 'undefined') {
    alert('JSZip 未加载，请检查网络连接。将逐个下载文件。');
    for (const item of items) {
      const blob = await getCropBlob(item.sx, item.sy, item.w, item.h);
      const link = document.createElement('a');
      link.download = item.name;
      link.href = URL.createObjectURL(blob);
      link.click();
      URL.revokeObjectURL(link.href);
      await new Promise(r => setTimeout(r, 200));
    }
    return;
  }

  const zip = new JSZip();
  const prefix = $('exportPrefix').value || 'sprite';

  for (const item of items) {
    const blob = await getCropBlob(item.sx, item.sy, item.w, item.h);
    zip.file(item.name, blob);
  }

  const content = await zip.generateAsync({ type: 'blob' });
  const link = document.createElement('a');
  link.download = `${prefix}_sprites.zip`;
  link.href = URL.createObjectURL(content);
  link.click();
  URL.revokeObjectURL(link.href);
}

function exportJSON() {
  if (!state.image) return;
  const g = state.grid;
  const prefix = $('exportPrefix').value || 'sprite';

  const atlas = {
    meta: {
      image: state.fileName + '.png',
      size: { w: state.image.width, h: state.image.height },
      frameSize: { w: g.w, h: g.h },
      grid: { cols: g.cols, rows: g.rows, gap: g.gap, offsetX: g.ox, offsetY: g.oy },
    },
    frames: {}
  };

  let idx = 0;
  const sorted = [...state.selected].sort((a, b) => {
    const [ar, ac] = a.split(',').map(Number);
    const [br, bc] = b.split(',').map(Number);
    return ar !== br ? ar - br : ac - bc;
  });

  for (const key of sorted) {
    const [r, c] = key.split(',').map(Number);
    const sx = g.ox + c * (g.w + g.gap);
    const sy = g.oy + r * (g.h + g.gap);
    const name = `${prefix}_${String(idx).padStart(3, '0')}`;
    atlas.frames[name] = {
      frame: { x: sx, y: sy, w: g.w, h: g.h },
      gridPos: { row: r, col: c },
    };
    idx++;
  }

  for (const rect of state.freeRects) {
    const name = `${prefix}_free_${String(idx).padStart(3, '0')}`;
    atlas.frames[name] = {
      frame: { x: rect.x, y: rect.y, w: rect.w, h: rect.h },
      type: 'freeform',
    };
    idx++;
  }

  const json = JSON.stringify(atlas, null, 2);
  const el = $('jsonOutput');
  el.style.display = 'block';
  el.textContent = json;

  // Download as .json file
  const blob = new Blob([json], { type: 'application/json' });
  const link = document.createElement('a');
  link.download = `${prefix}_atlas.json`;
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
}

function exportSpriteSheet() {
  if (!state.image || (state.selected.size === 0 && state.freeRects.length === 0)) return;
  const items = getExportItems();
  if (items.length === 0) return;
  const prefix = $('exportPrefix').value || 'sprite';

  // Pack into a new strip
  const maxH = Math.max(...items.map(i => i.h));
  const totalW = items.reduce((s, i) => s + i.w, 0);

  const cvs = document.createElement('canvas');
  cvs.width = totalW;
  cvs.height = maxH;
  const ctx = cvs.getContext('2d');

  let x = 0;
  for (const item of items) {
    ctx.drawImage(state.image, item.sx, item.sy, item.w, item.h, x, 0, item.w, item.h);
    x += item.w;
  }

  const link = document.createElement('a');
  link.download = `${prefix}_sheet.png`;
  link.href = cvs.toDataURL('image/png');
  link.click();
}

// ============================================================
// AI Hint
// ============================================================
function updateAIHint() {
  if (!state.image) return;
  const g = state.grid;
  const count = state.selected.size + state.freeRects.length;

  let hint = `图片: ${state.fileName}\n尺寸: ${state.image.width}×${state.image.height}px\n`;
  hint += `网格: ${g.w}×${g.h}px, ${g.cols}列×${g.rows}行\n`;
  hint += `已选: ${count} 帧\n\n`;

  if (state.selected.size > 0) {
    hint += `选中的网格坐标 (行,列):\n`;
    const sorted = [...state.selected].sort();
    hint += sorted.map(k => `  [${k}]`).join('\n');
    hint += '\n\n';
    hint += `在代码中使用:\n`;
    hint += `// 从精灵表切取单帧\n`;
    hint += `ctx.drawImage(spriteSheet, col*${g.w}, row*${g.h}, ${g.w}, ${g.h}, dx, dy, ${g.w}, ${g.h});\n`;
  }

  $('aiHint').textContent = hint;
}

function copyAIHint() {
  const text = $('aiHint').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✅ 已复制';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

// ============================================================
// Keyboard shortcuts
// ============================================================
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;

  if (e.key === '=' || e.key === '+') { zoomIn(); e.preventDefault(); }
  if (e.key === '-') { zoomOut(); e.preventDefault(); }
  if (e.key === '0') { zoomFit(); e.preventDefault(); }
  if (e.key === 'a' || e.key === 'A') { selectAll(); e.preventDefault(); }
  if (e.key === 'd' || e.key === 'D') { selectNonEmpty(); e.preventDefault(); }
  if (e.key === 'Escape') { clearSelection(); e.preventDefault(); }
  if (e.ctrlKey && e.key === 's') { exportSelected(); e.preventDefault(); }
  if (e.ctrlKey && e.key === 'j') { exportJSON(); e.preventDefault(); }
});

// Scroll to zoom
$('canvasArea').addEventListener('wheel', e => {
  e.preventDefault();
  if (e.deltaY < 0) zoomIn(); else zoomOut();
}, { passive: false });

// ============================================================
// Init
// ============================================================
setMode('grid');
$('btnModeGrid').style.borderColor = 'var(--primary)';
</script>
</body>
