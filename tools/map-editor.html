/* ============================================================
 *  MAP CANVAS — Central editor canvas
 * ============================================================ */
var MapCanvas = {
  _cvs: null,
  _ctx: null,
  _area: null,
  _cam: { x: 0, y: 0, zoom: 2 },
  _showGrid: true,
  _panning: false,
  _panStart: null,
  _lastGridPos: { x: -1, y: -1 },
  _rectPreview: null,
  _animFrameId: null,

  init: function() {
    this._cvs = document.getElementById('map-canvas');
    this._ctx = this._cvs.getContext('2d');
    this._area = document.getElementById('canvas-area');
    this._setupEvents();
    this._resize();
    window.addEventListener('resize', this._resize.bind(this));
  },

  _resize: function() {
    this._cvs.width = this._area.clientWidth;
    this._cvs.height = this._area.clientHeight;
    this.render();
  },

  _setupEvents: function() {
    var self = this;
    var area = this._area;

    area.addEventListener('mousedown', function(e) {
      e.preventDefault();
      // Space + any button, middle click, shift+click, alt+click, or right-click while space held → pan
      if (e.button === 1 || (e.button === 0 && e.shiftKey) || (e.button === 0 && e.altKey)
          || (_spaceHeld) || (e.button === 2 && _spaceHeld)) {
        self._panning = true;
        self._panStart = { x: e.clientX, y: e.clientY, camX: self._cam.x, camY: self._cam.y };
        area.style.cursor = 'grabbing';
        return;
      }
      var gp = self._screenToGrid(e.clientX, e.clientY);
      PaintTools.onMouseDown(gp.x, gp.y, e);
      self.render();
    });

    // Prevent context menu on canvas so right-click panning works
    area.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });

    area.addEventListener('mousemove', function(e) {
      if (self._panning) {
        self._cam.x = self._panStart.camX + (e.clientX - self._panStart.x);
        self._cam.y = self._panStart.camY + (e.clientY - self._panStart.y);
        self.render();
        return;
      }
      var gp = self._screenToGrid(e.clientX, e.clientY);
      document.getElementById('cursor-coords').textContent = 'X:' + gp.x + ' Y:' + gp.y;
      if (gp.x !== self._lastGridPos.x || gp.y !== self._lastGridPos.y) {
        self._lastGridPos = gp;
        PaintTools.onMouseMove(gp.x, gp.y);
      }
      // Rect preview
      if (PaintTools.currentTool === 'rect' && PaintTools._rectStart) {
        self._rectPreview = { x1: PaintTools._rectStart.x, y1: PaintTools._rectStart.y, x2: gp.x, y2: gp.y };
        self.render();
      }
    });

    area.addEventListener('mouseup', function(e) {
      if (self._panning) {
        self._panning = false;
        area.style.cursor = _spaceHeld ? 'grab' : 'crosshair';
        return;
      }
      var gp = self._screenToGrid(e.clientX, e.clientY);
      PaintTools.onMouseUp(gp.x, gp.y);
      self._rectPreview = null;
      self.render();
    });

    area.addEventListener('mouseleave', function() {
      self._panning = false;
      PaintTools._painting = false;
      self._rectPreview = null;
    });

    area.addEventListener('wheel', function(e) {
      e.preventDefault();
      var rect = area.getBoundingClientRect();
      var mx = e.clientX - rect.left;
      var my = e.clientY - rect.top;
      var oldZoom = self._cam.zoom;
      if (e.deltaY < 0) {
        self._cam.zoom = Math.min(self._cam.zoom * 1.15, 10);
      } else {
        self._cam.zoom = Math.max(self._cam.zoom / 1.15, 0.25);
      }
      // Zoom toward cursor
      var zr = self._cam.zoom / oldZoom;
      self._cam.x = mx - (mx - self._cam.x) * zr;
      self._cam.y = my - (my - self._cam.y) * zr;
      document.getElementById('zoom-display').textContent = Math.round(self._cam.zoom * 100) + '%';
      self.render();
    }, { passive: false });

    // Palette click
    document.getElementById('palette-canvas').addEventListener('click', function(e) {
      TilesetManager.onPaletteClick(e);
    });
  },

  _screenToGrid: function(clientX, clientY) {
    var rect = this._area.getBoundingClientRect();
    var sx = clientX - rect.left;
    var sy = clientY - rect.top;
    if (!MapData.current) return { x: 0, y: 0 };
    var tw = MapData.current.tileWidth * this._cam.zoom;
    var th = MapData.current.tileHeight * this._cam.zoom;
    var gx = Math.floor((sx - this._cam.x) / tw);
    var gy = Math.floor((sy - this._cam.y) / th);
    return { x: gx, y: gy };
  },

  toggleGrid: function() {
    this._showGrid = !this._showGrid;
    document.getElementById('btn-grid').classList.toggle('active', this._showGrid);
    this.render();
  },

  zoomIn: function() {
    this._cam.zoom = Math.min(this._cam.zoom * 1.25, 10);
    document.getElementById('zoom-display').textContent = Math.round(this._cam.zoom * 100) + '%';
    this.render();
  },
  zoomOut: function() {
    this._cam.zoom = Math.max(this._cam.zoom / 1.25, 0.25);
    document.getElementById('zoom-display').textContent = Math.round(this._cam.zoom * 100) + '%';
    this.render();
  },
  resetView: function() {
    this._cam = { x: 20, y: 20, zoom: 2 };
    document.getElementById('zoom-display').textContent = '200%';
    this.render();
  },

  render: function() {
    var ctx = this._ctx;
    var cvs = this._cvs;
    var cam = this._cam;
    ctx.clearRect(0, 0, cvs.width, cvs.height);

    if (!MapData.current) {
      ctx.fillStyle = '#333';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('按「新建」创建地图或「导入」加载已有地图', cvs.width / 2, cvs.height / 2);
      return;
    }

    var map = MapData.current;
    var tw = map.tileWidth * cam.zoom;
    var th = map.tileHeight * cam.zoom;

    ctx.imageSmoothingEnabled = false;

    // Draw layers from bottom to top
    for (var li = 0; li < map.layers.length; li++) {
      var layer = map.layers[li];
      if (!layer.visible) continue;

      if (layer.type === 'collision') {
        // Draw collision overlay
        for (var y = 0; y < map.height; y++) {
          for (var x = 0; x < map.width; x++) {
            var val = layer.data[y * map.width + x];
            if (val === 1) {
              var px = cam.x + x * tw;
              var py = cam.y + y * th;
              if (px + tw < 0 || px > cvs.width || py + th < 0 || py > cvs.height) continue;
              ctx.fillStyle = 'rgba(255,0,0,0.3)';
              ctx.fillRect(px, py, tw, th);
              ctx.strokeStyle = 'rgba(255,0,0,0.6)';
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(px, py);
              ctx.lineTo(px + tw, py + th);
              ctx.moveTo(px + tw, py);
              ctx.lineTo(px, py + th);
              ctx.stroke();
            }
          }
        }
        continue;
      }

      // Tile layer
      for (var y = 0; y < map.height; y++) {
        for (var x = 0; x < map.width; x++) {
          var tile = layer.data[y * map.width + x];
          if (!tile) continue;
          var tsIdx = tile[0];
          var tileId = tile[1];
          var ts = TilesetManager.tilesets[tsIdx];
          if (!ts) continue;
          var px = cam.x + x * tw;
          var py = cam.y + y * th;
          if (px + tw < 0 || px > cvs.width || py + th < 0 || py > cvs.height) continue;
          var sc = tileId % ts.cols;
          var sr = Math.floor(tileId / ts.cols);
          ctx.drawImage(ts.img, sc * ts.tw, sr * ts.th, ts.tw, ts.th, px, py, tw, th);
        }
      }
    }

    // Map boundary
    ctx.strokeStyle = '#f5c518';
    ctx.lineWidth = 2;
    ctx.strokeRect(cam.x, cam.y, map.width * tw, map.height * th);

    // Grid
    if (this._showGrid) {
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 1;
      var startX = Math.max(0, Math.floor(-cam.x / tw));
      var endX = Math.min(map.width, Math.ceil((cvs.width - cam.x) / tw));
      var startY = Math.max(0, Math.floor(-cam.y / th));
      var endY = Math.min(map.height, Math.ceil((cvs.height - cam.y) / th));
      for (var x = startX; x <= endX; x++) {
        var px = cam.x + x * tw;
        ctx.beginPath();
        ctx.moveTo(Math.round(px) + 0.5, cam.y);
        ctx.lineTo(Math.round(px) + 0.5, cam.y + map.height * th);
        ctx.stroke();
      }
      for (var y = startY; y <= endY; y++) {
        var py = cam.y + y * th;
        ctx.beginPath();
        ctx.moveTo(cam.x, Math.round(py) + 0.5);
        ctx.lineTo(cam.x + map.width * tw, Math.round(py) + 0.5);
        ctx.stroke();
      }
    }

    // Active layer highlight (current cell under cursor)
    if (this._lastGridPos && MapData.current) {
      var gx = this._lastGridPos.x;
      var gy = this._lastGridPos.y;
      if (gx >= 0 && gx < map.width && gy >= 0 && gy < map.height) {
        var bs = PaintTools.brushSize;
        var half = Math.floor(bs / 2);
        ctx.strokeStyle = 'rgba(233,69,96,0.7)';
        ctx.lineWidth = 2;
        ctx.strokeRect(
          cam.x + (gx - half) * tw,
          cam.y + (gy - half) * th,
          bs * tw, bs * th
        );
      }
    }

    // Rect preview
    if (this._rectPreview) {
      var rp = this._rectPreview;
      var rx1 = Math.min(rp.x1, rp.x2), ry1 = Math.min(rp.y1, rp.y2);
      var rx2 = Math.max(rp.x1, rp.x2), ry2 = Math.max(rp.y1, rp.y2);
      ctx.strokeStyle = 'rgba(245,197,24,0.8)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(cam.x + rx1 * tw, cam.y + ry1 * th, (rx2 - rx1 + 1) * tw, (ry2 - ry1 + 1) * th);
      ctx.setLineDash([]);
    }

    // Draw spawns
    if (MapData.current.spawns) {
      MapData.current.spawns.forEach(function(s) {
        var px = cam.x + s.x * tw + tw / 2;
        var py = cam.y + s.y * th + th / 2;
        ctx.fillStyle = 'rgba(76,175,80,0.5)';
        ctx.beginPath();
        ctx.arc(px, py, tw * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = Math.max(10, tw * 0.4) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(s.type === 'player' ? 'P' : s.type === 'npc' ? 'N' : s.type === 'enemy' ? 'E' : '?', px, py);
      });
    }

    // Draw triggers
    if (MapData.current.triggers) {
      MapData.current.triggers.forEach(function(t) {
        var px = cam.x + t.x * tw;
        var py = cam.y + t.y * th;
        ctx.fillStyle = 'rgba(33,150,243,0.3)';
        ctx.fillRect(px, py, t.w * tw, t.h * th);
        ctx.strokeStyle = 'rgba(33,150,243,0.8)';
        ctx.lineWidth = 2;
        ctx.strokeRect(px, py, t.w * tw, t.h * th);
        ctx.fillStyle = '#fff';
        ctx.font = Math.max(9, tw * 0.35) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(t.type === 'portal' ? '🚪' : '⚡', px + t.w * tw / 2, py + t.h * th / 2);
      });
    }
  }
};

/* ============================================================
 *  MAP I/O — Import, Export, LocalStorage
 * ============================================================ */
var MapIO = {
  _autoSaveKey: 'map_editor_autosave',
  _indexKey: 'map_editor_index',

  saveToLocal: function() {
    if (!MapData.current) { showToast('无地图数据', 'error'); return; }
    var data = {
      map: MapData.serialize(),
      tilesets: TilesetManager.serialize(),
      folders: FolderBrowser.serialize(),
      activeLayer: LayerPanel.activeLayer
    };
    try {
      localStorage.setItem(this._autoSaveKey, JSON.stringify(data));
      showToast('已保存到浏览器', 'success');
    } catch (e) {
      showToast('保存失败: ' + e.message, 'error');
    }
  },

  loadFromLocal: function() {
    try {
      var raw = localStorage.getItem(this._autoSaveKey);
      if (!raw) return false;
      var data = JSON.parse(raw);
      return Promise.all([
        TilesetManager.deserialize(data.tilesets || []),
        FolderBrowser.deserialize(data.folders || [])
      ]).then(function() {
        MapData.deserialize(data.map);
        LayerPanel.activeLayer = data.activeLayer || 0;
        App._syncUI();
        showToast('已从浏览器恢复', 'info');
        return true;
      });
    } catch (e) {
      console.error('Load failed:', e);
      return Promise.resolve(false);
    }
  },

  exportJSON: function() {
    if (!MapData.current) { showToast('无地图数据', 'error'); return; }
    var exportData = {
      map: MapData.serialize(),
      tilesets: TilesetManager.serialize().map(function(ts) {
        // For export, include tileset metadata but make src a relative path reference
        return {
          id: ts.id,
          name: ts.name,
          src: ts.src,  // keeps dataURL so maps are self-contained
          tw: ts.tw,
          th: ts.th,
          cols: ts.cols,
          rows: ts.rows,
          tiles: ts.tiles
        };
      }),
      folders: FolderBrowser.serialize()
    };
    var json = JSON.stringify(exportData, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (MapData.current.id || 'map') + '.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('已导出: ' + a.download, 'success');
  },

  exportRegistry: function() {
    var index = MapIndex.getAll();
    // Generate a JS data file for the game runtime
    var lines = [
      '/**',
      ' * 地图注册表 — 自动生成，请勿手动编辑',
      ' * 生成时间: ' + new Date().toLocaleString(),
      ' */',
      'var MapRegistryData = {',
      '  maps: {'
    ];
    var entries = [];
    for (var id in index) {
      var m = index[id];
      entries.push('    "' + id + '": ' + JSON.stringify({
        name: m.name,
        width: m.width,
        height: m.height,
        file: 'js/data/maps/' + id + '.json',
        tilesets: m.tilesets || []
      }));
    }
    lines.push(entries.join(',\n'));
    lines.push('  }');
    lines.push('};');
    var text = lines.join('\n');
    var blob = new Blob([text], { type: 'text/javascript' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'map-registry.js';
    a.click();
    URL.revokeObjectURL(url);
    showToast('注册表已导出', 'success');
  },

  // Export map data without tileset image data (for game runtime - smaller file)
  exportMapDataOnly: function() {
    if (!MapData.current) { showToast('无地图数据', 'error'); return; }
    var map = MapData.serialize();
    // Reference tileset IDs instead of embedding data
    map.tilesetRefs = TilesetManager.tilesets.map(function(ts) {
      return { id: ts.id, name: ts.name, tw: ts.tw, th: ts.th, cols: ts.cols, rows: ts.rows };
    });
    var json = JSON.stringify(map, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (MapData.current.id || 'map') + '_data.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('地图数据已导出（不含贴图）', 'success');
  },

  importJSON: function() {
    document.getElementById('import-file').click();
  },

  onImportFile: function(files) {
    if (!files || files.length === 0) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var data = JSON.parse(e.target.result);
        if (data.tilesets) {
          Promise.all([
            TilesetManager.deserialize(data.tilesets),
            FolderBrowser.deserialize(data.folders || [])
          ]).then(function() {
            if (data.map) {
              MapData.deserialize(data.map);
            }
            LayerPanel.activeLayer = 0;
            App._syncUI();
            UndoManager.clear();
            showToast('地图已导入', 'success');
          });
        } else if (data.layers) {
          // Raw map data without tilesets
          MapData.deserialize(data);
          App._syncUI();
          UndoManager.clear();
          showToast('地图数据已导入（无贴图集）', 'info');
        } else {
          showToast('无法识别的文件格式', 'error');
        }
      } catch (err) {
        showToast('导入失败: ' + err.message, 'error');
      }
    };
    reader.readAsText(files[0]);
    // Reset file input
    document.getElementById('import-file').value = '';
  }
};

/* ============================================================
 *  MAP INDEX — Registry of all maps
 * ============================================================ */
var MapIndex = {
  _storageKey: 'map_editor_index',

  getAll: function() {
    try {
      return JSON.parse(localStorage.getItem(this._storageKey)) || {};
    } catch (e) { return {}; }
  },

  save: function(index) {
    localStorage.setItem(this._storageKey, JSON.stringify(index));
  },

  addCurrent: function() {
    if (!MapData.current) { showToast('无地图数据', 'error'); return; }
    var index = this.getAll();
    var m = MapData.current;
    index[m.id] = {
      id: m.id,
      name: m.name,
      width: m.width,
      height: m.height,
      tilesets: TilesetManager.tilesets.map(function(ts) { return ts.id; }),
      updatedAt: Date.now()
    };
    this.save(index);
    // Also save the full map data to localStorage under its ID
    var data = {
      map: MapData.serialize(),
      tilesets: TilesetManager.serialize(),
      folders: FolderBrowser.serialize(),
    };
    localStorage.setItem('map_data_' + m.id, JSON.stringify(data));
    this.renderList();
    showToast('已添加到索引: ' + m.name, 'success');
  },

  removeCurrent: function() {
    if (!MapData.current) return;
    var index = this.getAll();
    delete index[MapData.current.id];
    localStorage.removeItem('map_data_' + MapData.current.id);
    this.save(index);
    this.renderList();
    showToast('已从索引移除', 'info');
  },

  loadMap: function(id) {
    try {
      var raw = localStorage.getItem('map_data_' + id);
      if (!raw) { showToast('找不到地图数据: ' + id, 'error'); return; }
      var data = JSON.parse(raw);
      Promise.all([
        TilesetManager.deserialize(data.tilesets || []),
        FolderBrowser.deserialize(data.folders || [])
      ]).then(function() {
        MapData.deserialize(data.map);
        LayerPanel.activeLayer = 0;
        App._syncUI();
        UndoManager.clear();
        showToast('已加载: ' + MapData.current.name, 'success');
      });
    } catch (e) {
      showToast('加载失败: ' + e.message, 'error');
    }
  },

  renderList: function() {
    var el = document.getElementById('map-index-list');
    var index = this.getAll();
    var keys = Object.keys(index);
    if (keys.length === 0) {
      el.innerHTML = '<li style="color:var(--text-dim);font-size:0.72rem;padding:4px;">索引为空，添加地图到索引</li>';
      return;
    }
    var html = '';
    keys.forEach(function(id) {
      var m = index[id];
      var activeCls = MapData.current && MapData.current.id === id ? ' active' : '';
      html += '<li class="map-list-item' + activeCls + '" onclick="MapIndex.loadMap(\'' + id + '\')">' +
              '<span class="map-item-name">🗺️ ' + (m.name || id) + '</span>' +
              '<span class="map-item-size">' + m.width + '×' + m.height + '</span>' +
              '</li>';
    });
    el.innerHTML = html;
  }
};

/* ============================================================
 *  APP — Main application controller
 * ============================================================ */
var App = {
  init: function() {
    MapCanvas.init();
    // Try to load from localStorage
    var loaded = MapIO.loadFromLocal();
    if (loaded && loaded.then) {
      loaded.then(function(success) {
        if (!success) App.newMap();
        MapIndex.renderList();
      });
    } else {
      this.newMap();
      MapIndex.renderList();
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;

      if (e.ctrlKey && e.key === 'z') { e.preventDefault(); UndoManager.undo(); }
      else if (e.ctrlKey && e.key === 'y') { e.preventDefault(); UndoManager.redo(); }
      else if (e.ctrlKey && e.key === 's') { e.preventDefault(); MapIO.saveToLocal(); }
      else if (e.ctrlKey && e.key === 'n') { e.preventDefault(); App.newMap(); }
      else if (e.key === 'b') PaintTools.setTool('brush');
      else if (e.key === 'r') PaintTools.setTool('rect');
      else if (e.key === 'g') PaintTools.setTool('fill');
      else if (e.key === 'e') PaintTools.setTool('eraser');
      else if (e.key === 'i') PaintTools.setTool('eyedrop');
      else if (e.key === 'p') PaintTools.setTool('spawn');
      else if (e.key === 't') PaintTools.setTool('trigger');
      else if (e.key === '=' || e.key === '+') MapCanvas.zoomIn();
      else if (e.key === '-') MapCanvas.zoomOut();
    });

    // Drag & drop for tileset
    var dropZone = document.getElementById('tileset-drop');
    dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
    dropZone.addEventListener('drop', function(e) {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      // Check for folder drops via dataTransfer.items (contains directories)
      var items = e.dataTransfer.items;
      if (items) {
        var imageFiles = [];
        for (var i = 0; i < items.length; i++) {
          var item = items[i];
          if (item.kind === 'file') {
            var file = item.getAsFile();
            if (file && file.type.startsWith('image/')) imageFiles.push(file);
          }
        }
        if (imageFiles.length > 0) {
          // If multiple individual PNGs dropped, add to folder browser
          if (imageFiles.length > 1) {
            FolderBrowser.onMultiFileSelect(imageFiles);
          } else {
            TilesetManager.onFileSelect(imageFiles);
          }
        }
      } else {
        TilesetManager.onFileSelect(e.dataTransfer.files);
      }
    });

    // Also support dropping on the whole page
    document.body.addEventListener('dragover', function(e) { e.preventDefault(); });
    document.body.addEventListener('drop', function(e) {
      e.preventDefault();
      if (e.target.id !== 'tileset-drop' && !e.target.closest('#tileset-drop')) {
        var imageFiles = [];
        for (var i = 0; i < e.dataTransfer.files.length; i++) {
          if (e.dataTransfer.files[i].type.startsWith('image/')) {
            imageFiles.push(e.dataTransfer.files[i]);
          }
        }
        if (imageFiles.length > 1) {
          FolderBrowser.onMultiFileSelect(imageFiles);
        } else if (imageFiles.length === 1) {
          TilesetManager.onFileSelect(imageFiles);
        }
      }
    });

    // Auto-save every 60 seconds
    setInterval(function() {
      if (MapData.current) {
        MapIO.saveToLocal();
      }
    }, 60000);
  },

  newMap: function() {
    MapData.createNew({
      width: parseInt(document.getElementById('map-width').value) || 30,
      height: parseInt(document.getElementById('map-height').value) || 20,
      tileWidth: parseInt(document.getElementById('tile-w').value) || 16,
      tileHeight: parseInt(document.getElementById('tile-h').value) || 16
    });
    UndoManager.clear();
    LayerPanel.activeLayer = 0;
    this._syncUI();
    showToast('新地图已创建', 'info');
  },

  resizeMap: function() {
    if (!MapData.current) return;
    var newW = parseInt(document.getElementById('map-width').value) || 30;
    var newH = parseInt(document.getElementById('map-height').value) || 20;
    UndoManager.pushState();
    MapData.resizeMap(newW, newH);
    MapCanvas.render();
    showToast('地图已调整为 ' + newW + '×' + newH, 'info');
  },

  _syncUI: function() {
    if (!MapData.current) return;
    document.getElementById('map-name').value = MapData.current.name;
    document.getElementById('map-id').value = MapData.current.id;
    document.getElementById('map-width').value = MapData.current.width;
    document.getElementById('map-height').value = MapData.current.height;
    document.getElementById('map-tile-info').textContent = MapData.current.tileWidth + '×' + MapData.current.tileHeight;
    LayerPanel.render();
    MarkerPanel.renderSpawns();
    MarkerPanel.renderTriggers();
    MapCanvas.render();
  }
};

/* ============================================================
 *  INIT
 * ============================================================ */
document.addEventListener('DOMContentLoaded', function() {
  App.init();
});
</script>
</body>
</html>
