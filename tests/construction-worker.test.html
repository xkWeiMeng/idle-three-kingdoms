<!-- ===== Mock 全局依赖：模块加载前定义 ===== -->
<script>
// ---- 共享 mock 状态 ----
var _emitted = [];
var _rmSpendCalls = [];
var _rmSpendMultipleCalls = [];
var _rmAddCalls = [];
var _rmAddMultipleCalls = [];
var _mockCanAfford = true;
var _mockCanAffordMultiple = true;
var _mockStageClear = {};
var _roadGridBuilt = false;
var _mockCollisionGrid = [[1, 2], [3, 4]];

// CONSTANTS mock
var CONSTANTS = {
  RESOURCE: {
    GOLD: 'gold', JADE: 'jade', EXP: 'exp',
    FOOD: 'food', WOOD: 'wood', STONE: 'stone', IRON: 'iron'
  },
  RESOURCE_BASE_CAP: {
    gold: 50000,
    wood: 2000,
    stone: 2000,
    iron: 1000,
    food: 200
  }
};

// ResourceManager mock — tracks all calls for assertion
var ResourceManager = {
  canAfford: function(type, amount) { return _mockCanAfford; },
  canAffordMultiple: function(costs) { return _mockCanAffordMultiple; },
  spend: function(type, amount, cat, src, detail) {
    _rmSpendCalls.push({ type: type, amount: amount, cat: cat, src: src, detail: detail });
  },
  spendMultiple: function(costs, cat, src, detail) {
    _rmSpendMultipleCalls.push({ costs: costs, cat: cat, src: src, detail: detail });
  },
  add: function(type, amount, cat, src, detail) {
    _rmAddCalls.push({ type: type, amount: amount, cat: cat, src: src, detail: detail });
  },
  addMultiple: function(amounts, cat, src, detail) {
    _rmAddMultipleCalls.push({ amounts: amounts, cat: cat, src: src, detail: detail });
    for (var t in amounts) {
      if (amounts.hasOwnProperty(t) && amounts[t] > 0) {
        _rmAddCalls.push({ type: t, amount: amounts[t], cat: cat, src: src, detail: detail });
      }
    }
  }
};

// BattleManager mock
var BattleManager = {
  isStageCleared: function(stageId) {
    return _mockStageClear.hasOwnProperty(stageId) ? _mockStageClear[stageId] : true;
  }
};

// TownWorld mock
var TownWorld = {
  MAP_W: 40,
  MAP_H: 40,
  _defaultPositions: {},
  _buildingSizes: {},
  getCollisionGrid: function() { return _mockCollisionGrid; },
  _buildRoadGrid: function() { _roadGridBuilt = true; }
};
</script>

<!-- 核心依赖 -->
<script src="../js/core/event-bus.js"></script>
<script src="../js/core/utils.js"></script>

<!-- 数据 -->
<script src="../js/data/buildings.js"></script>

<!-- 被测模块 -->
<script src="../js/modules/town-manager.js"></script>

<script>
/**
 * 规范引用：specs/product-specs/construction-worker-system.md (Active)
 *
 * 测试策略：
 *   - Mock CONSTANTS, ResourceManager, BattleManager, TownWorld
 *   - 拦截 EventBus.emit 记录事件
 *   - 每个测试前 resetTM() 重置状态
 *   - 覆盖全部 8 个能力（CAP-WORKER-01 ~ 08）
 */

// ===== 微型测试框架 =====

var _results = [];
var _log = document.getElementById('results');
var _currentSection = '';

function section(name) {
  _currentSection = name;
  var el = document.createElement('div');
  el.className = 'section';
  el.textContent = '▸ ' + name;
  _log.appendChild(el);
}

function test(name, fn) {
  var entry = { section: _currentSection, name: name, status: 'pass', error: null };
  try {
    fn();
  } catch (e) {
    entry.status = 'fail';
    entry.error = e.message || String(e);
  }
  _results.push(entry);
  var el = document.createElement('div');
  el.className = entry.status;
  el.textContent = (entry.status === 'pass' ? '  ✓ ' : '  ✗ ') + name;
  if (entry.error) el.textContent += ' — ' + entry.error;
  _log.appendChild(el);
}

function assert(condition, msg) {
  if (!condition) throw new Error(msg || 'Assertion failed');
}

function assertEqual(actual, expected, msg) {
  if (actual !== expected) {
    throw new Error((msg ? msg + ' ' : '') +
      'expected=' + JSON.stringify(expected) + ' actual=' + JSON.stringify(actual));
  }
}

function assertDeepEqual(actual, expected, msg) {
  if (JSON.stringify(actual) !== JSON.stringify(expected)) {
    throw new Error((msg ? msg + ' ' : '') +
      'expected=' + JSON.stringify(expected) + ' actual=' + JSON.stringify(actual));
  }
}

// ===== 拦截 EventBus.emit =====
var _origEmit = EventBus.emit;
EventBus.emit = function(event) {
  var args = Array.prototype.slice.call(arguments, 1);
  _emitted.push({ event: event, args: args });
};

function getEmitted(eventName) {
  return _emitted.filter(function(e) { return e.event === eventName; });
}

// ===== 重置辅助 =====
function resetTM(savedData) {
  _emitted = [];
  _rmSpendCalls = [];
  _rmSpendMultipleCalls = [];
  _rmAddCalls = [];
  _rmAddMultipleCalls = [];
  _mockCanAfford = true;
  _mockCanAffordMultiple = true;
  _mockStageClear = {};
  _roadGridBuilt = false;
  TownManager.init(savedData);
}

// ================================================================
// Group 1: CAP-WORKER-01 — Worker Initialization & Unlock
// ================================================================
section('CAP-WORKER-01: 工人初始化与解锁');

test('W01-S1: 新游戏 → workers=1, firstBuildingCompleted=false, getMaxBuildSlots()===1', function() {
  resetTM(undefined);
  assertEqual(TownManager._state.workers, 1, 'workers');
  assertEqual(TownManager._state.firstBuildingCompleted, false, 'firstBuildingCompleted');
  assertEqual(TownManager.getMaxBuildSlots(), 1, 'getMaxBuildSlots');
});

test('W01-S2: 第一个非城主府建筑完成 → workers=2, firstBuildingCompleted=true, emit town:worker_unlocked', function() {
  resetTM(undefined);
  // Setup: lumber_camp Lv.0, set buildEndTime in the past to trigger completion
  TownManager._state.buildings.lumber_camp.buildEndTime = Date.now() - 100;
  _emitted = []; // Clear init events
  TownManager.onTick(1);
  // After tick, lumber_camp should be level 1 (completed)
  assertEqual(TownManager._state.buildings.lumber_camp.level, 1, 'lumber_camp level after completion');
  assertEqual(TownManager._state.workers, 2, 'workers after first building');
  assertEqual(TownManager._state.firstBuildingCompleted, true, 'firstBuildingCompleted');
  var unlocked = getEmitted('town:worker_unlocked');
  assert(unlocked.length >= 1, 'should emit town:worker_unlocked');
  assertEqual(unlocked[0].args[0].count, 2, 'worker count in event');
  // Also check toast
  var toasts = getEmitted('toast:show');
  var foundToast = toasts.some(function(t) { return t.args[0].message.indexOf('第一个建筑') >= 0; });
  assert(foundToast, 'should emit toast about first building');
});

test('W01-S3: 重复完成建筑时 firstBuildingCompleted=true → workers 不变（不重复奖励）', function() {
  resetTM(undefined);
  TownManager._state.workers = 2;
  TownManager._state.firstBuildingCompleted = true;
  TownManager._state.buildings.quarry.buildEndTime = Date.now() - 100;
  _emitted = [];
  TownManager.onTick(1);
  assertEqual(TownManager._state.workers, 2, 'workers should remain 2');
  var unlocked = getEmitted('town:worker_unlocked');
  assertEqual(unlocked.length, 0, 'no worker_unlocked event');
});

test('W01-S4: 城主府升到 Lv.3 → workers=3', function() {
  resetTM(undefined);
  TownManager._state.workers = 2;
  TownManager._state.firstBuildingCompleted = true;
  TownManager._state.buildings.town_hall.level = 2;
  TownManager._state.buildings.town_hall.buildEndTime = Date.now() - 100;
  _emitted = [];
  TownManager.onTick(1);
  // town_hall should now be level 3
  assertEqual(TownManager._state.buildings.town_hall.level, 3, 'town_hall level');
  assertEqual(TownManager._state.workers, 3, 'workers after TH Lv.3');
  var unlocked = getEmitted('town:worker_unlocked');
  assert(unlocked.length >= 1, 'should emit worker_unlocked');
  assertEqual(unlocked[0].args[0].count, 3, 'worker count');
});

test('W01-S5: 城主府升到 Lv.5 → workers=4', function() {
  resetTM(undefined);
  TownManager._state.workers = 3;
  TownManager._state.firstBuildingCompleted = true;
  TownManager._state.buildings.town_hall.level = 4;
  TownManager._state.buildings.town_hall.buildEndTime = Date.now() - 100;
  _emitted = [];
  TownManager.onTick(1);
  assertEqual(TownManager._state.buildings.town_hall.level, 5, 'town_hall level');
  assertEqual(TownManager._state.workers, 4, 'workers after TH Lv.5');
});

test('W01-S6: 城主府升到 Lv.7 → workers=5 (MAX_WORKERS)', function() {
  resetTM(undefined);
  TownManager._state.workers = 4;
  TownManager._state.firstBuildingCompleted = true;
  TownManager._state.buildings.town_hall.level = 6;
  TownManager._state.buildings.town_hall.buildEndTime = Date.now() - 100;
  _emitted = [];
  TownManager.onTick(1);
  assertEqual(TownManager._state.buildings.town_hall.level, 7, 'town_hall level');
  assertEqual(TownManager._state.workers, 5, 'workers after TH Lv.7 (capped)');
});

test('W01-S7: 存档迁移 — 无workers字段, town_hall Lv.6, 有完成建筑 → workers=4', function() {
  // Old save: no workers field, town_hall level 6, barracks level 2 (completed building)
  resetTM({
    town: {
      buildings: {
        town_hall: { level: 6 },
        barracks: { level: 2 },
        lumber_camp: { level: 1 }
      }
      // No workers field → triggers migration
    }
  });
  // Migration: workers=1 → barracks Lv.2 (non-TH, level>=1) → workers=2, firstBuildingCompleted=true
  // TH Lv.6 >= 3 → workers=max(2,3)=3
  // TH Lv.6 >= 5 → workers=max(3,4)=4
  // TH Lv.6 < 7 → no change
  // min(4, MAX_WORKERS=5) → 4
  assertEqual(TownManager._state.workers, 4, 'migrated workers');
  assertEqual(TownManager._state.firstBuildingCompleted, true, 'firstBuildingCompleted should be true');
  assertDeepEqual(TownManager._state.buildQueue, [], 'buildQueue should be empty');
});

test('W01-S8: 存档迁移 — town_hall Lv.10（远超7）→ workers=5（不超过 MAX_WORKERS）', function() {
  resetTM({
    town: {
      buildings: {
        town_hall: { level: 10 },
        lumber_camp: { level: 5 }
      }
    }
  });
  assertEqual(TownManager._state.workers, 5, 'migrated workers capped at 5');
});

test('W01-S9: 存档恢复 — 有workers字段 → 直接使用存档值', function() {
  resetTM({
    town: {
      buildings: {
        town_hall: { level: 5 },
        barracks: { level: 3 }
      },
      workers: 3,
      firstBuildingCompleted: true,
      buildQueue: [{ id: 'q1', buildingId: 'quarry', targetLevel: 1, cost: { gold: 200 }, buildTime: 30, addedAt: 1000 }]
    }
  });
  assertEqual(TownManager._state.workers, 3, 'workers from save');
  assertEqual(TownManager._state.firstBuildingCompleted, true, 'firstBuildingCompleted from save');
});

// ================================================================
// Group 2: CAP-WORKER-02 — Build Queue Enqueue
// ================================================================
section('CAP-WORKER-02: 建造队列入队');

test('W02-S1: 成功入队 → 资源预扣, buildQueue 增长, 返回 {ok:true, queueItem}', function() {
  resetTM(undefined);
  // Setup: TH Lv.3 (levelCap=5), lumber_camp Lv.0, plenty of resources
  TownManager._state.buildings.town_hall.level = 3;
  // lumber_camp has no requires, Lv.0 → targetLevel=1
  _mockCanAffordMultiple = true;
  // Occupy all workers so item stays in queue (workers=1, put 1 active)
  TownManager._state.buildings.quarry.buildEndTime = Date.now() + 60000;
  _emitted = [];
  _rmSpendMultipleCalls = [];

  var result = TownManager.enqueueUpgrade('lumber_camp');
  assertEqual(result.ok, true, 'should return ok:true');
  assert(result.queueItem !== undefined, 'should return queueItem');
  assertEqual(result.queueItem.buildingId, 'lumber_camp', 'queueItem.buildingId');
  assertEqual(result.queueItem.targetLevel, 1, 'queueItem.targetLevel');
  assert(typeof result.queueItem.id === 'string', 'queueItem should have an id');
  assert(typeof result.queueItem.buildTime === 'number', 'queueItem should have buildTime');
  assert(typeof result.queueItem.cost === 'object', 'queueItem should have cost');
  // Resources were spent
  assert(_rmSpendMultipleCalls.length >= 1, 'spendMultiple should be called');
  assertEqual(_rmSpendMultipleCalls[0].cat, 'building', 'spend category');
  assertEqual(_rmSpendMultipleCalls[0].src, 'queue_reserve', 'spend source');
  // Queue updated event emitted
  var queueEvents = getEmitted('town:queue_updated');
  assert(queueEvents.length >= 1, 'should emit town:queue_updated');
});

test('W02-S2: 队列已满（6项）→ 返回 {ok:false, reason:"建造队列已满（最多6项）"}', function() {
  resetTM(undefined);
  TownManager._state.buildings.town_hall.level = 3;
  // Fill queue with 6 dummy items
  for (var i = 0; i < 6; i++) {
    TownManager._state.buildQueue.push({
      id: 'dummy_' + i, buildingId: 'dummy_' + i, targetLevel: 1,
      cost: { gold: 100 }, buildTime: 30, addedAt: Date.now()
    });
  }
  var result = TownManager.enqueueUpgrade('lumber_camp');
  assertEqual(result.ok, false, 'should fail');
  assertEqual(result.reason, '建造队列已满（最多6项）', 'reason');
});

test('W02-S3: 建筑已在队列中 → 返回 {ok:false, reason:"该建筑已在队列中"}', function() {
  resetTM(undefined);
  TownManager._state.buildings.town_hall.level = 3;
  TownManager._state.buildQueue.push({
    id: 'q1', buildingId: 'lumber_camp', targetLevel: 1,
    cost: { gold: 200 }, buildTime: 30, addedAt: Date.now()
  });
  var result = TownManager.enqueueUpgrade('lumber_camp');
  assertEqual(result.ok, false, 'should fail');
  assertEqual(result.reason, '该建筑已在队列中', 'reason');
});

test('W02-S4: 建筑正在施工中 → 返回 {ok:false, reason:"正在施工中"}', function() {
  resetTM(undefined);
  TownManager._state.buildings.town_hall.level = 3;
  TownManager._state.buildings.lumber_camp.buildEndTime = Date.now() + 60000;
  var result = TownManager.enqueueUpgrade('lumber_camp');
  assertEqual(result.ok, false, 'should fail');
  assertEqual(result.reason, '正在施工中', 'reason');
});

test('W02-S5: 资源不足 → 返回 {ok:false, reason:"资源不足"}, buildQueue 不变', function() {
  resetTM(undefined);
  TownManager._state.buildings.town_hall.level = 3;
  _mockCanAffordMultiple = false;
  var queueBefore = TownManager._state.buildQueue.length;
  var result = TownManager.enqueueUpgrade('lumber_camp');
  assertEqual(result.ok, false, 'should fail');
  assertEqual(result.reason, '资源不足', 'reason');
  assertEqual(TownManager._state.buildQueue.length, queueBefore, 'queue unchanged');
});

test('W02-S6: 入队时有空闲工人 → 立即开始施工（item 从 queue 移出）', function() {
  resetTM(undefined);
  // workers=1 (default), no active builds → 1 free worker
  TownManager._state.buildings.town_hall.level = 3;
  _mockCanAffordMultiple = true;
  _emitted = [];

  var result = TownManager.enqueueUpgrade('lumber_camp');
  assertEqual(result.ok, true, 'enqueue should succeed');
  // Item should have been processed immediately by _processQueue
  // buildQueue should be empty (item was taken out)
  assertEqual(TownManager._state.buildQueue.length, 0, 'queue should be empty after immediate dispatch');
  // lumber_camp should now have buildEndTime set
  assert(TownManager._state.buildings.lumber_camp.buildEndTime !== null, 'buildEndTime should be set');
  assert(TownManager._state.buildings.lumber_camp.buildEndTime > Date.now() - 1000, 'buildEndTime should be in the future');
  // building_started event should be emitted
  var started = getEmitted('town:building_started');
  assert(started.length >= 1, 'should emit town:building_started');
  assertEqual(started[0].args[0].buildingId, 'lumber_camp', 'started event buildingId');
});

test('W02-S7: town_hall Lv.0 入队 → targetLevel 应为 2 (跳过 Lv.1)', function() {
  resetTM(undefined);
  // town_hall is already Lv.1 by default, so this tests the town_hall special case
  // Actually town_hall starts at Lv.1, so costFormula(2) is used
  // enqueueUpgrade for town_hall at Lv.1 → targetLevel = 2
  _mockCanAffordMultiple = true;
  _mockStageClear = { 'stage_1_10': true }; // unlock stage for TH Lv.2
  // Occupy worker so item stays in queue
  TownManager._state.buildings.barracks.buildEndTime = Date.now() + 60000;
  var result = TownManager.enqueueUpgrade('town_hall');
  assertEqual(result.ok, true, 'enqueue should succeed');
  // Check the queue item
  assert(TownManager._state.buildQueue.length >= 0, 'item may have been dispatched');
});

// ================================================================
// Group 3: CAP-WORKER-03 — Queue Auto-dispatch (_processQueue)
// ================================================================
section('CAP-WORKER-03: 队列自动派工');

test('W03-S1: 3 workers, 1 active, queue 有 2 项 → 两项都开始, queue 清空', function() {
  resetTM(undefined);
  TownManager._state.workers = 3;
  TownManager._state.firstBuildingCompleted = true;
  TownManager._state.buildings.town_hall.level = 5;
  // 1 active build
  TownManager._state.buildings.barracks.level = 1;
  TownManager._state.buildings.barracks.buildEndTime = Date.now() + 60000;
  // Queue 2 items: lumber_camp Lv.0→1, quarry Lv.0→1
  TownManager._state.buildQueue = [
    { id: 'qa', buildingId: 'lumber_camp', targetLevel: 1, cost: { gold: 200 }, buildTime: 30, addedAt: Date.now() },
    { id: 'qb', buildingId: 'quarry', targetLevel: 1, cost: { gold: 200 }, buildTime: 30, addedAt: Date.now() }
  ];
  _emitted = [];

  TownManager._processQueue();

  // Both should be started
  assert(TownManager._state.buildings.lumber_camp.buildEndTime !== null, 'lumber_camp should be started');
  assert(TownManager._state.buildings.quarry.buildEndTime !== null, 'quarry should be started');
  assertEqual(TownManager._state.buildQueue.length, 0, 'queue should be empty');
  // building_started emitted twice
  var started = getEmitted('town:building_started');
  assertEqual(started.length, 2, 'should emit building_started twice');
  // queue_updated emitted
  var queueUpdated = getEmitted('town:queue_updated');
  assert(queueUpdated.length >= 1, 'should emit town:queue_updated');
});

test('W03-S2: 2 workers, 2 active, queue 有 3 项 → queue 不变（无空闲工人）', function() {
  resetTM(undefined);
  TownManager._state.workers = 2;
  TownManager._state.firstBuildingCompleted = true;
  // 2 active builds
  TownManager._state.buildings.lumber_camp.buildEndTime = Date.now() + 60000;
  TownManager._state.buildings.quarry.buildEndTime = Date.now() + 60000;
  // Queue 3 items
  TownManager._state.buildQueue = [
    { id: 'qa', buildingId: 'iron_mine', targetLevel: 1, cost: { gold: 200 }, buildTime: 30, addedAt: Date.now() },
    { id: 'qb', buildingId: 'barracks', targetLevel: 1, cost: { gold: 300 }, buildTime: 30, addedAt: Date.now() },
    { id: 'qc', buildingId: 'farmland', targetLevel: 1, cost: { gold: 200 }, buildTime: 30, addedAt: Date.now() }
  ];
  _emitted = [];

  TownManager._processQueue();

  assertEqual(TownManager._state.buildQueue.length, 3, 'queue should remain unchanged');
  var started = getEmitted('town:building_started');
  assertEqual(started.length, 0, 'no building_started events');
});

test('W03-S3: 队首项 level 不匹配 → 退还资源, 移除, 处理下一项', function() {
  resetTM(undefined);
  TownManager._state.workers = 2;
  TownManager._state.firstBuildingCompleted = true;
  TownManager._state.buildings.town_hall.level = 5;
  // Queue head: lumber_camp targetLevel=2, but lumber_camp is Lv.0 (mismatch: 0 !== 2-1=1)
  TownManager._state.buildings.lumber_camp.level = 0;
  // Queue second item: quarry Lv.0→1 (valid)
  TownManager._state.buildQueue = [
    { id: 'qa', buildingId: 'lumber_camp', targetLevel: 2, cost: { gold: 300, wood: 50 }, buildTime: 30, addedAt: Date.now() },
    { id: 'qb', buildingId: 'quarry', targetLevel: 1, cost: { gold: 200 }, buildTime: 30, addedAt: Date.now() }
  ];
  _emitted = [];
  _rmAddMultipleCalls = [];

  TownManager._processQueue();

  // First item should be removed and resources refunded
  assert(_rmAddMultipleCalls.length >= 1, 'addMultiple should be called for refund');
  assertEqual(_rmAddMultipleCalls[0].amounts.gold, 300, 'refund gold');
  assertEqual(_rmAddMultipleCalls[0].amounts.wood, 50, 'refund wood');
  assertEqual(_rmAddMultipleCalls[0].cat, 'building', 'refund category');
  assertEqual(_rmAddMultipleCalls[0].src, 'queue_refund', 'refund source');
  // Toast warning should be emitted
  var toasts = getEmitted('toast:show');
  var warningFound = toasts.some(function(t) { return t.args[0].type === 'warning' && t.args[0].message.indexOf('失效') >= 0; });
  assert(warningFound, 'should emit warning toast about invalidated task');
  // Second item should have started
  assert(TownManager._state.buildings.quarry.buildEndTime !== null, 'quarry should be started');
  assertEqual(TownManager._state.buildQueue.length, 0, 'queue should be empty');
});

test('W03-S4: 施工完成后 onTick 触发 _processQueue → 队列下一项开始施工', function() {
  resetTM(undefined);
  TownManager._state.workers = 2;
  TownManager._state.firstBuildingCompleted = true;
  TownManager._state.buildings.town_hall.level = 5;
  // 1 active build about to complete
  TownManager._state.buildings.lumber_camp.buildEndTime = Date.now() - 100;
  // 1 item in queue: quarry Lv.0→1
  TownManager._state.buildQueue = [
    { id: 'qa', buildingId: 'quarry', targetLevel: 1, cost: { gold: 200 }, buildTime: 30, addedAt: Date.now() }
  ];
  _emitted = [];

  TownManager.onTick(1);

  // lumber_camp should have completed (level 1)
  assertEqual(TownManager._state.buildings.lumber_camp.level, 1, 'lumber_camp level after completion');
  assertEqual(TownManager._state.buildings.lumber_camp.buildEndTime, null, 'lumber_camp buildEndTime cleared');
  // quarry should have started from queue
  assert(TownManager._state.buildings.quarry.buildEndTime !== null, 'quarry should be started from queue');
  assertEqual(TownManager._state.buildQueue.length, 0, 'queue should be empty');
});

// ================================================================
// Group 4: CAP-WORKER-04 — Cancel Queue/Active Tasks
// ================================================================
section('CAP-WORKER-04: 取消队列/施工任务');

test('W04-S1: 取消等待的队列项 → 资源退还, 移除, 返回 {ok:true, refunded:true}', function() {
  resetTM(undefined);
  TownManager._state.buildings.town_hall.level = 3;
  var queueItem = {
    id: 'cancel_me', buildingId: 'lumber_camp', targetLevel: 1,
    cost: { gold: 500, wood: 100 }, buildTime: 30, addedAt: Date.now()
  };
  TownManager._state.buildQueue.push(queueItem);
  _emitted = [];

section('CAP-WORKER-07: 离线队列推进');

test('W07-S1: 离线 2h, 1 active build (1h ago expired), queue 有 2 项 (各 30min) → 全部完成', function() {
  var now = Date.now();
  var oneHourMs = 3600 * 1000;
  var thirtyMinMs = 1800 * 1000;

  // Simulate: build expired 1 hour ago
  resetTM({
    town: {
      buildings: {
        town_hall: { level: 5 },
        lumber_camp: { level: 0, buildEndTime: now - oneHourMs },
        quarry: { level: 0 },
        iron_mine: { level: 0 }
      },
      workers: 3,
      firstBuildingCompleted: true,
      buildQueue: [
        { id: 'q1', buildingId: 'quarry', targetLevel: 1, cost: { gold: 200 }, buildTime: 1800, addedAt: now - 2 * oneHourMs },
        { id: 'q2', buildingId: 'iron_mine', targetLevel: 1, cost: { gold: 200 }, buildTime: 1800, addedAt: now - 2 * oneHourMs }
      ]
    }
  });

  // After init, _processOfflineBuilds should have:
  // 1. Completed lumber_camp (expired 1h ago) → level 1
  // 2. Started quarry from queue at completedAt time, quarry.buildEndTime = (now - 1h) + 30min*1000 = now - 30min → also expired → completed
  // 3. Started iron_mine from queue, iron_mine.buildEndTime = quarry's completedAt + 30min → may also be expired
  // All should be completed since total offline time >> total build time
  assertEqual(TownManager._state.buildings.lumber_camp.level, 1, 'lumber_camp should be level 1');
  assertEqual(TownManager._state.buildings.lumber_camp.buildEndTime, null, 'lumber_camp buildEndTime null');
  assertEqual(TownManager._state.buildings.quarry.level, 1, 'quarry should be level 1');
  assertEqual(TownManager._state.buildings.quarry.buildEndTime, null, 'quarry buildEndTime null');
  assertEqual(TownManager._state.buildings.iron_mine.level, 1, 'iron_mine should be level 1');
  assertEqual(TownManager._state.buildings.iron_mine.buildEndTime, null, 'iron_mine buildEndTime null');
  assertEqual(TownManager._state.buildQueue.length, 0, 'queue should be empty');
});

  var oneHourMs = 3600 * 1000;

  resetTM({

      },

      firstBuildingCompleted: true,
      buildQueue: [
        { id: 'q1', buildingId: 'quarry', targetLevel: 1, cost: { gold: 200 }, buildTime: 1800, addedAt: now - 2 * oneHourMs },
        { id: 'q2', buildingId: 'iron_mine', targetLevel: 1, cost: { gold: 300 }, buildTime: 1800, addedAt: now - 2 * oneHourMs }
      ]
    }
  });

  // quarry already level 1, targetLevel 1 → level(1) !== targetLevel-1(0) → validation fails → refund
  // iron_mine should still be processed and completed
  assertEqual(TownManager._state.buildings.lumber_camp.level, 1, 'lumber_camp completed');
  // quarry level should not change (validation failed)
  assertEqual(TownManager._state.buildings.quarry.level, 1, 'quarry level unchanged (validation failed)');
  // iron_mine should have been processed
  assertEqual(TownManager._state.buildings.iron_mine.level, 1, 'iron_mine completed');
  assertEqual(TownManager._state.buildQueue.length, 0, 'queue should be empty');
});
