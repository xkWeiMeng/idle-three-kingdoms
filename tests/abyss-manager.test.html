<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AbyssManager 规范测试</title>
<style>
  body { font-family: monospace; background: #1a1a2e; color: #eee; padding: 20px; }
  .pass { color: #4caf50; }
  .fail { color: #f44336; }
  .skip { color: #ff9800; }
  .section { margin: 16px 0 4px; font-weight: bold; color: #e94560; }
  .summary { margin-top: 20px; padding: 12px; background: #16213e; border-radius: 6px; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>AbyssManager 规范测试</h1>
<pre>规范引用：specs/services/abyss-manager.md</pre>
<div id="results"></div>
<div id="summary" class="summary"></div>

<!-- 加载核心依赖 -->
<script src="../js/core/constants.js"></script>
<script src="../js/core/event-bus.js"></script>
<script src="../js/core/utils.js"></script>
<script src="../js/data/abyss.js"></script>
<script src="../js/modules/abyss-manager.js"></script>

<script>
/**
 * 规范引用：specs/services/abyss-manager.md
 * 测试骨架：从 18 个能力的 WHEN/THEN 场景生成
 *
 * 测试策略：mock Math.random() 返回固定值/序列来验证概率相关场景
 */

// ===== 微型测试框架 =====
var _results = [];
var _log = document.getElementById('results');
var _currentSection = '';

function section(name) {
  _currentSection = name;
  var el = document.createElement('div');
  el.className = 'section';
  el.textContent = '▸ ' + name;
  _log.appendChild(el);
}

function test(name, fn) {
  var entry = { section: _currentSection, name: name, status: 'pass', error: null };
  try {
    fn();
  } catch (e) {
    entry.status = 'fail';
    entry.error = e.message || String(e);
  }
  _results.push(entry);
  var el = document.createElement('div');
  el.className = entry.status;
  el.textContent = (entry.status === 'pass' ? '  ✓ ' : '  ✗ ') + name;
  if (entry.error) el.textContent += ' — ' + entry.error;
  _log.appendChild(el);
}

function skip(name) {
  _results.push({ section: _currentSection, name: name, status: 'skip', error: null });
  var el = document.createElement('div');
  el.className = 'skip';
  el.textContent = '  ⊘ ' + name + ' (跳过)';
  _log.appendChild(el);
}

function assert(condition, msg) {
  if (!condition) throw new Error(msg || 'Assertion failed');
}

function assertEqual(actual, expected, msg) {
  if (actual !== expected) throw new Error((msg || '') + ' expected=' + JSON.stringify(expected) + ' actual=' + JSON.stringify(actual));
}

// ===== Mock 依赖 =====

var _emitted = [];
var _originalRandom = Math.random;

function mockRandom(value) {
  Math.random = function() { return value; };
}

function mockRandomSeq(values) {
  var idx = 0;
  Math.random = function() {
    var v = values[idx % values.length];
    idx++;
    return v;
  };
}

function restoreRandom() {
  Math.random = _originalRandom;
}

// Intercept EventBus.emit
var _origEmit = EventBus.emit;
EventBus.emit = function(event) {
  var args = Array.prototype.slice.call(arguments, 1);
  _emitted.push({ event: event, args: args });
  if (_origEmit) _origEmit.apply(EventBus, arguments);
};

// Mock BattleManager
var BattleManager = {
  _cleared: [],
  getClearedStages: function() { return this._cleared; }
};

// Mock HeroManager
var HeroManager = {
  _team: [],
  _templates: {},
  _stats: {},
  _heroes: {},
  getTeam: function() { return this._team; },
  getTemplate: function(id) { return this._templates[id] || null; },
  getHeroStats: function(uid) { return this._stats[uid] || null; },
  getHeroByUid: function(uid) { return this._heroes[uid] || null; }
};

// Mock ResourceManager
var ResourceManager = {
  _resources: {},
  canAfford: function(type, amount) { return (this._resources[type] || 0) >= amount; },
  spend: function(type, amount) {
    if (!this.canAfford(type, amount)) return false;
    this._resources[type] -= amount;
    return true;
  },
  add: function(type, amount) { this._resources[type] = (this._resources[type] || 0) + amount; },
  reset: function() { this._resources = {}; }
};

// Mock TownManager
var TownManager = {
  getAtkBonus: function() { return 0; },
  getDefBonus: function() { return 0; },
  getHpBonus: function() { return 0; }
};

// Mock EquipmentManager
var EquipmentManager = {
  _inventory: [],
  addToInventory: function(equip) { this._inventory.push(equip); return true; },
  generateDrop: null
};

// Mock ForgeManager
var ForgeManager = {
  _blueprints: [],
  addBlueprint: function(id) { this._blueprints.push(id); }
};

// Mock global functions
var _getHeroSetBonusesReturn = [];
function getHeroSetBonuses(equipment) { return _getHeroSetBonusesReturn; }

var _getMythicTemplateReturn = null;
function getMythicTemplate(id) { return _getMythicTemplateReturn; }

// ===== 测试辅助 =====

function resetAll() {
  _emitted = [];
  restoreRandom();

  BattleManager._cleared = [];

  HeroManager._team = [];
  HeroManager._templates = {};
  HeroManager._stats = {};
  HeroManager._heroes = {};

  ResourceManager.reset();

  TownManager.getAtkBonus = function() { return 0; };
  TownManager.getDefBonus = function() { return 0; };
  TownManager.getHpBonus = function() { return 0; };

  EquipmentManager._inventory = [];
  EquipmentManager.generateDrop = null;

  ForgeManager._blueprints = [];

  _getHeroSetBonusesReturn = [];
  _getMythicTemplateReturn = null;

  AbyssManager.init({});
}

function setupTeam(count) {
  count = count || 2;
  HeroManager._team = [];
  for (var i = 0; i < count; i++) {
    var uid = 'hero_' + i;
    var id = 'tmpl_' + i;
    HeroManager._team.push({
      uid: uid, id: id, level: 1, exp: 0,
      equipment: { weapon: null, armor: null, accessory: null, mount: null }
    });
    HeroManager._templates[id] = {
      name: '测试武将' + i, emoji: '⚔', skill: null
    };
    HeroManager._stats[uid] = { atk: 100, def: 50, hp: 500, spd: 30 };
    HeroManager._heroes[uid] = {
      uid: uid, id: id,
      equipment: { weapon: null, armor: null, accessory: null, mount: null }
    };
  }
}

function setupAbyssUnlocked(abyssId) {
  var stage = AbyssData[abyssId].unlockCondition.stage;
  if (BattleManager._cleared.indexOf(stage) === -1) {
    BattleManager._cleared.push(stage);
  }
}

/** Enter an abyss with all preconditions met; clears _emitted after entry */
function enterAbyssSetup(abyssId, teamCount) {
  abyssId = abyssId || 'abyss_hulao';
  teamCount = teamCount || 2;
  setupAbyssUnlocked(abyssId);
  setupTeam(teamCount);
  var cost = AbyssData[abyssId].ticketCost;
  ResourceManager._resources = {
    jade: cost.jade + 100,
    gold: cost.gold + 10000,
    iron: cost.iron + 500
  };
  AbyssManager._state.unlocked = true;
  var result = AbyssManager.enterAbyss(abyssId);
  _emitted = [];
  return result;
}


// ===== 能力 1：初始化与存档恢复 =====

section('能力 1：初始化与存档恢复');

test('WHEN saved=undefined THEN default state for all abysses', function() {
  resetAll();
  AbyssManager.init(undefined);
  assertEqual(AbyssManager.isUnlocked(), false, 'unlocked=false');
  var abyssIds = Object.keys(AbyssData);
  for (var i = 0; i < abyssIds.length; i++) {
    var inst = AbyssManager.getInstance(abyssIds[i]);
    assert(inst, abyssIds[i] + ' instance exists');
    assertEqual(inst.cleared, false, abyssIds[i] + ' cleared');
    assertEqual(inst.lastAttempt, 0, abyssIds[i] + ' lastAttempt');
    assertEqual(inst.bestFloor, 0, abyssIds[i] + ' bestFloor');
    assertEqual(inst.totalAttempts, 0, abyssIds[i] + ' totalAttempts');
    assertEqual(inst.mythicDropCount, 0, abyssIds[i] + ' mythicDropCount');
  }
  assertEqual(AbyssManager.getCurrentRun(), null, 'currentRun=null');
});

test('WHEN saved has partial data THEN restore + create missing', function() {
  resetAll();
  AbyssManager.init({
    abyss: {
      unlocked: true,
      instances: {
        abyss_hulao: { cleared: true, bestFloor: 5, totalAttempts: 3, mythicDropCount: 1, lastAttempt: 100 }
      }
    }
  });
  assertEqual(AbyssManager.isUnlocked(), true, 'unlocked restored');
  var hulao = AbyssManager.getInstance('abyss_hulao');
  assertEqual(hulao.cleared, true, 'hulao cleared');
  assertEqual(hulao.bestFloor, 5, 'hulao bestFloor');
  assertEqual(hulao.totalAttempts, 3, 'hulao totalAttempts');
  assertEqual(hulao.mythicDropCount, 1, 'hulao mythicDropCount');
  // Missing abysses auto-created
  var chibi = AbyssManager.getInstance('abyss_chibi');
  assert(chibi, 'chibi auto-created');
  assertEqual(chibi.cleared, false, 'chibi default cleared');
  var guandu = AbyssManager.getInstance('abyss_guandu');
  assert(guandu, 'guandu auto-created');
  assertEqual(guandu.cleared, false, 'guandu default cleared');
});

test('WHEN saved has currentRun data THEN currentRun=null (never restore)', function() {
  resetAll();
  AbyssManager.init({
    abyss: {
      unlocked: true,
      instances: {},
      currentRun: { abyssId: 'abyss_hulao', phase: 'fighting' }
    }
  });
  assertEqual(AbyssManager.getCurrentRun(), null, 'currentRun always null');
});


// ===== 能力 2：系统解锁检查 =====

section('能力 2：系统解锁检查');

test('WHEN unlocked=false AND stage_4_10 cleared THEN unlock + toast', function() {
  resetAll();
  AbyssManager._state.unlocked = false;
  BattleManager._cleared = ['stage_4_10'];
  AbyssManager.onTick(1.0);
  assertEqual(AbyssManager.isUnlocked(), true, 'unlocked');
  var toast = _emitted.find(function(e) { return e.event === 'toast:show' && e.args[0].type === 'success'; });
  assert(toast, 'success toast emitted');
  assert(toast.args[0].message.indexOf('深渊挑战已解锁') >= 0, 'unlock message');
});

test('WHEN unlocked=false AND stage_4_10 NOT cleared THEN stays false', function() {
  resetAll();
  AbyssManager._state.unlocked = false;
  BattleManager._cleared = ['stage_3_5'];
  AbyssManager.onTick(1.0);
  assertEqual(AbyssManager.isUnlocked(), false, 'still locked');
  var toast = _emitted.find(function(e) { return e.event === 'toast:show' && e.args[0].type === 'success'; });
  assert(!toast, 'no unlock toast');
});

test('WHEN unlocked=true THEN no check (short-circuit)', function() {
  resetAll();
  AbyssManager._state.unlocked = true;
  BattleManager._cleared = [];
  AbyssManager.onTick(1.0);
  assertEqual(AbyssManager.isUnlocked(), true, 'remains true');
});

test('WHEN BattleManager undefined THEN no error, stays false', function() {
  resetAll();
  AbyssManager._state.unlocked = false;
  var savedBM = BattleManager;
  BattleManager = undefined;
  AbyssManager.onTick(1.0);
  assertEqual(AbyssManager.isUnlocked(), false, 'stays false');
  BattleManager = savedBM;
});

section('能力 3：单深渊解锁检查');

test('WHEN abyss_hulao AND stage_4_10 cleared THEN true', function() {

section('能力 5：进入深渊');

  var result = AbyssManager.enterAbyss('abyss_hulao');

});

  assertEqual(result, false, 'returns false');
  var toast = _emitted.find(function(e) { return e.event === 'toast:show' && e.args[0].message.indexOf('⛏️×200') >= 0; });
  assert(toast, 'iron insufficient toast');
});

test('WHEN all conditions met THEN enter success, deduct resources, init run', function() {
  resetAll();
  setupAbyssUnlocked('abyss_hulao');
  setupTeam(3);
  ResourceManager._resources = { jade: 100, gold: 20000, iron: 500 };
  var result = AbyssManager.enterAbyss('abyss_hulao');
  assertEqual(result, true, 'returns true');
  // Resources deducted
  assertEqual(ResourceManager._resources.jade, 70, 'jade deducted 30');
  assertEqual(ResourceManager._resources.gold, 15000, 'gold deducted 5000');
  assertEqual(ResourceManager._resources.iron, 300, 'iron deducted 200');
  // Instance updated
  var inst = AbyssManager.getInstance('abyss_hulao');
  assertEqual(inst.totalAttempts, 1, 'totalAttempts incremented');
  assert(inst.lastAttempt > 0, 'lastAttempt updated');
  // Run initialized
  var run = AbyssManager.getCurrentRun();
  assert(run, 'currentRun exists');
  assertEqual(run.abyssId, 'abyss_hulao', 'abyssId');
  assertEqual(run.currentFloor, 1, 'floor 1');
  assertEqual(run.phase, 'fighting', 'phase fighting');
  assertEqual(run.allies.length, 3, '3 allies');
  assertEqual(run.enemies.length, 1, '1 enemy (boss)');
  assertEqual(run.rewards.gold, 0, 'rewards init 0');
  assertEqual(run.rewards.exp, 0, 'rewards init 0');
  assertEqual(run.droppedEquipment.length, 0, 'no drops yet');
  // Event emitted
  var entered = _emitted.find(function(e) { return e.event === 'abyss:entered'; });
  assert(entered, 'abyss:entered emitted');
  assertEqual(entered.args[0].abyssId, 'abyss_hulao', 'correct abyssId in event');
});


// ===== 能力 5a：构建队友单位 =====

section('能力 5a：构建队友单位');

test('WHEN TownManager bonuses applied THEN atk/def/hp affected, spd NOT', function() {
  resetAll();
  setupAbyssUnlocked('abyss_hulao');
  setupTeam(1);
  HeroManager._stats['hero_0'] = { atk: 100, def: 80, hp: 500, spd: 30 };
  TownManager.getAtkBonus = function() { return 0.1; };
  TownManager.getDefBonus = function() { return 0.2; };
  TownManager.getHpBonus = function() { return 0.15; };
  ResourceManager._resources = { jade: 999, gold: 99999, iron: 999 };
  AbyssManager._state.unlocked = true;
  AbyssManager.enterAbyss('abyss_hulao');
  var run = AbyssManager.getCurrentRun();
  var ally = run.allies[0];
  assertEqual(ally.atk, Math.floor(100 * 1.1), 'atk=110');
  assertEqual(ally.def, Math.floor(80 * 1.2), 'def=96');
  assertEqual(ally.maxHp, Math.floor(500 * 1.15), 'maxHp=575');
  assertEqual(ally.currentHp, Math.floor(500 * 1.15), 'currentHp=maxHp=575');
  assertEqual(ally.spd, 30, 'spd NOT affected by TownManager');
  assertEqual(ally.baseAtk, Math.floor(100 * 1.1), 'baseAtk=110');
  assertEqual(ally.baseDef, Math.floor(80 * 1.2), 'baseDef=96');
  assertEqual(ally.baseSpd, 30, 'baseSpd=30');
});

// ===== 能力 7：战斗推进 =====

section('能力 7：战斗推进');

test('WHEN phase=fighting AND onTick(1.0) THEN 1 round', function() {
  resetAll();
  enterAbyssSetup('abyss_hulao', 2);
  // Make heroes tanky so battle doesn't end
  var run = AbyssManager.getCurrentRun();
  run.allies[0].currentHp = 9999; run.allies[0].maxHp = 9999; run.allies[0].def = 9999;
  run.allies[1].currentHp = 9999; run.allies[1].maxHp = 9999; run.allies[1].def = 9999;
  run.enemies[0].currentHp = 99999; run.enemies[0].maxHp = 99999; run.enemies[0].def = 9999;
  AbyssManager.onTick(1.0);
