<script>
/**
 * 规范引用：specs/services/farm-manager.md (Active)
 * 执行计划：specs/exec-plans/farm-manager.md (T3)
 *
 * 测试策略：mock ResourceManager + TownManager + EconomyManager + EventBus.emit
 * 覆盖：全部 14 个能力的 62 个 WHEN/THEN 场景
 */

// ===== 微型测试框架 =====
var _results = [];
var _log = document.getElementById('results');
var _currentSection = '';

function section(name) {
  _currentSection = name;
  var el = document.createElement('div');
  el.className = 'section';
  el.textContent = '▸ ' + name;
  _log.appendChild(el);
}

function test(name, fn) {
  var entry = { section: _currentSection, name: name, status: 'pass', error: null };
  try {
    fn();
  } catch (e) {
    entry.status = 'fail';
    entry.error = e.message || String(e);
  }
  _results.push(entry);
  var el = document.createElement('div');
  el.className = entry.status;
  el.textContent = (entry.status === 'pass' ? '  ✓ ' : '  ✗ ') + name;
  if (entry.error) el.textContent += ' — ' + entry.error;
  _log.appendChild(el);
}

function assert(condition, msg) {
  if (!condition) throw new Error(msg || 'Assertion failed');
}

function assertEqual(actual, expected, msg) {
  if (actual !== expected) {
    throw new Error((msg || '') + ' expected=' + JSON.stringify(expected) + ' actual=' + JSON.stringify(actual));
  }
}

function assertDeepEqual(actual, expected, msg) {
  if (JSON.stringify(actual) !== JSON.stringify(expected)) {
    throw new Error((msg || '') + ' expected=' + JSON.stringify(expected) + ' actual=' + JSON.stringify(actual));
  }
}

// ===== Mock EventBus — 拦截 emit，记录调用 =====
var _emitted = [];
var _origEmit = EventBus.emit.bind(EventBus);
EventBus.emit = function(event) {
  var args = Array.prototype.slice.call(arguments, 1);
  _emitted.push({ event: event, data: args[0] });
};

function getEmitted(eventName) {
  return _emitted.filter(function(e) { return e.event === eventName; });
}

// ===== Mock ResourceManager =====
var ResourceManager = {
  _resources: { gold: 10000, food: 100, jade: 50 },
  _spendLog: [],
  _addLog: [],
  get: function(type) { return this._resources[type] || 0; },
  add: function(type, amount) {
    if (amount <= 0) return; // real behavior: ignore non-positive
    this._resources[type] = (this._resources[type] || 0) + amount;
    this._addLog.push({ type: type, amount: amount });
  },
  spend: function(type, amount, cat, src, detail) {
    if (!this.canAfford(type, amount)) return false;
    this._resources[type] -= amount;
    this._spendLog.push({ type: type, amount: amount, category: cat, source: src });
    return true;
  },
  canAfford: function(type, amount) { return (this._resources[type] || 0) >= amount; },
  canAffordMultiple: function(costs) {
    for (var t in costs) {
      if (costs.hasOwnProperty(t)) {
        if (!this.canAfford(t, costs[t])) return false;
      }
    }
    return true;
  },
  spendMultiple: function(costs, cat, src, detail) {
    if (!this.canAffordMultiple(costs)) return false;
    for (var t in costs) {
      if (costs.hasOwnProperty(t)) {
        this.spend(t, costs[t], cat, src, detail);
      }
    }
    return true;
  },
  reset: function() {
    this._resources = { gold: 10000, food: 100, jade: 50 };
    this._spendLog = [];
    this._addLog = [];
  }
};

// ===== Mock TownManager =====
var TownManager = {
  _buildings: {
    vegetable_garden: { level: 3 },
    compost_pit: { level: 2 },
    seed_shop: { level: 3 }
  },
  getState: function() {
    return { buildings: Utils.deepClone(this._buildings) };
  },
  setLevel: function(id, level) {
    if (!this._buildings[id]) this._buildings[id] = {};
    this._buildings[id].level = level;
  },
  reset: function() {
    this._buildings = {
      vegetable_garden: { level: 3 },
      compost_pit: { level: 2 },
      seed_shop: { level: 3 }
    };
  }
};

// ===== Mock EconomyManager (optional dependency) =====
var EconomyManager = {
  _log: [],
  logEvent: function(entry) { this._log.push(entry); },
  reset: function() { this._log = []; }
};

// ===== Reset all mocks + FarmManager state =====
function resetAll() {
  ResourceManager.reset();
  TownManager.reset();
  EconomyManager.reset();
  _emitted = [];
  FarmManager._state = {
    plots: [],
    inventory: {},
    seeds: {},
    fertilizer: 0,
    farmExp: 0,
    autoHarvest: false,
    activeBuff: null
  };
  FarmManager.init({});
}

<script>

// ===== 辅助函数 =====

/** 在指定田地上设置 growing 状态的作物 */
function plantOnPlot(plotIndex, cropId) {
  var crop = CropData[cropId];
  var plot = FarmManager._state.plots[plotIndex];
  plot.cropId = cropId;
  plot.state = 'growing';
  plot.plantedAt = Date.now();
  plot.watered = false;
  plot.fertilized = false;
  plot.hasBug = false;
  plot.bugTriggered = false;
  plot.remainHarvests = crop.reharvestCount || 0;
  plot.isReharvest = false;
}

/** 在指定田地上设置 ready 状态的作物 */
function setPlotReady(plotIndex, cropId) {
  var plot = FarmManager._state.plots[plotIndex];
  plot.cropId = cropId;
  plot.state = 'ready';
  plot.plantedAt = Date.now() - 999999;
  plot.readyAt = Date.now();
  plot.watered = false;
  plot.fertilized = false;
  plot.hasBug = false;
  plot.bugTriggered = true;
  plot.remainHarvests = 0;
  plot.isReharvest = false;
}

// ===== Math.random 备份 =====
var _origRandom = Math.random;

// =====================================================================
// Section 1: 初始化与持久化 (C1, 3 tests)
// =====================================================================
section('能力 1：初始化与持久化 (C1)');

test('C1-S1: init 首次游戏 — 菜园 level=0 时 plots 为空', function() {
  ResourceManager.reset();
  TownManager.reset();
  EconomyManager.reset();
  _emitted = [];
  TownManager.setLevel('vegetable_garden', 0);
  FarmManager._state = {
    plots: [], inventory: {}, seeds: {},
    fertilizer: 0, farmExp: 0, autoHarvest: false, activeBuff: null
  };
  FarmManager.init({});

  var state = FarmManager.getState();
  assertEqual(state.plots.length, 0, 'plots 应为空数组');
  assertDeepEqual(state.inventory, {}, 'inventory 为空');
  assertDeepEqual(state.seeds, {}, 'seeds 为空');
  assertEqual(state.fertilizer, 0, 'fertilizer=0');
  assertEqual(state.farmExp, 0, 'farmExp=0');
});

test('C1-S2: init 恢复存档+补田 — 2个存档plot + garden=3(4田) → 4 plots', function() {
  ResourceManager.reset();
  TownManager.reset();
  EconomyManager.reset();
  _emitted = [];
  TownManager.setLevel('vegetable_garden', 3); // GardenLevelData[3].plots = 4
  FarmManager._state = {
    plots: [], inventory: {}, seeds: {},
    fertilizer: 0, farmExp: 0, autoHarvest: false, activeBuff: null
  };

  var savedPlots = [
    { cropId: 'cabbage', state: 'growing', plantedAt: Date.now() - 1000,
      readyAt: null, watered: false, fertilized: false,
      hasBug: false, bugTriggered: false, remainHarvests: 0, isReharvest: false },
    { cropId: null, state: 'idle', plantedAt: null,
      readyAt: null, watered: false, fertilized: false,
      hasBug: false, bugTriggered: false, remainHarvests: 0, isReharvest: false }
  ];
  FarmManager.init({ farm: { plots: savedPlots, farmExp: 500 } });

  var state = FarmManager.getState();
  assertEqual(state.plots.length, 4, '应补充到 4 块田');
  assertEqual(state.plots[0].cropId, 'cabbage', '保留存档 plot[0]');
  assertEqual(state.plots[1].state, 'idle', '保留存档 plot[1]');
  assertEqual(state.plots[2].state, 'idle', '补充的 plot[2]');
  assertEqual(state.plots[3].state, 'idle', '补充的 plot[3]');
  assertEqual(state.farmExp, 500, 'farmExp 恢复为 500');
});

test('C1-S3: getState 深拷贝 — 修改返回值不影响内部状态', function() {
  resetAll();
  var state1 = FarmManager.getState();
  state1.farmExp = 99999;
  state1.inventory['hacked'] = 100;
  if (state1.plots.length > 0) state1.plots[0].state = 'hacked';

  var state2 = FarmManager.getState();
  assertEqual(state2.farmExp, 0, '内部 farmExp 不受影响');
  assertEqual(state2.inventory['hacked'], undefined, '内部 inventory 不受影响');
  if (state2.plots.length > 0) {
    assertEqual(state2.plots[0].state, 'idle', '内部 plots 不受影响');
  }
});

// =====================================================================
// Section 2: 播种 (C2, 6 tests)
// =====================================================================
section('能力 2：播种 (C2)');

test('C2-S1: plant 成功 — 消耗种子、设置 growing、emit farm:planted', function() {
  resetAll();
  FarmManager._state.seeds['cabbage'] = 3;
  _emitted = [];

  var result = FarmManager.plant(0, 'cabbage');

  assertEqual(result.ok, true, '返回 ok:true');
  assertEqual(FarmManager._state.seeds['cabbage'], 2, 'seeds.cabbage -= 1');
  var plot = FarmManager._state.plots[0];
  assertEqual(plot.cropId, 'cabbage', 'cropId=cabbage');
  assertEqual(plot.state, 'growing', 'state=growing');
  assert(typeof plot.plantedAt === 'number' && plot.plantedAt > 0, 'plantedAt 已设');
  assertEqual(plot.watered, false, 'watered=false');
  assertEqual(plot.fertilized, false, 'fertilized=false');
  assertEqual(plot.hasBug, false, 'hasBug=false');
  assertEqual(plot.bugTriggered, false, 'bugTriggered=false');
  assertEqual(plot.remainHarvests, 0, 'cabbage reharvestCount=0');
  assertEqual(plot.isReharvest, false, 'isReharvest=false');

  var events = getEmitted('farm:planted');
  assertEqual(events.length, 1, '应 emit 1 次 farm:planted');
  assertEqual(events[0].data.plotIndex, 0, '载荷 plotIndex=0');
  assertEqual(events[0].data.cropId, 'cabbage', '载荷 cropId=cabbage');
});

test('C2-S2: plant 种子不足 — 返回 {ok:false}', function() {
  resetAll();
  // 不设置种子

  var result = FarmManager.plant(0, 'cabbage');

  assertEqual(result.ok, false, 'ok=false');
  assert(result.reason.indexOf('种子不足') >= 0, 'reason 包含种子不足');
});

test('C2-S3: plant 田地已占用 — growing 状态拒绝', function() {
  resetAll();
  plantOnPlot(0, 'cabbage');
  FarmManager._state.seeds['cabbage'] = 5;
  _emitted = [];

  var result = FarmManager.plant(0, 'cabbage');

  assertEqual(result.ok, false, 'ok=false');
  assert(result.reason.indexOf('田地已占用') >= 0, 'reason 包含田地已占用');
});

test('C2-S4: plant 无效田地 — plotIndex=99 不存在', function() {
  resetAll();
  FarmManager._state.seeds['cabbage'] = 5;

  var result = FarmManager.plant(99, 'cabbage');

  assertEqual(result.ok, false, 'ok=false');
  assert(result.reason.indexOf('无效田地') >= 0, 'reason 包含无效田地');
});

test('C2-S5: plant 品级不足 — snow_lotus quality=4 > qualityUnlock=2', function() {
  resetAll();
  // garden level=3, qualityUnlock=2; snow_lotus quality=4
  FarmManager._state.seeds['snow_lotus'] = 5;

  var result = FarmManager.plant(0, 'snow_lotus');

  assertEqual(result.ok, false, 'ok=false');
  assert(result.reason.indexOf('菜园等级不足') >= 0, 'reason 包含菜园等级不足');
});

test('C2-S6: plant 未知作物 — cropId 不在 CropData 中', function() {
  resetAll();
  FarmManager._state.seeds['nonexistent'] = 5;

  var result = FarmManager.plant(0, 'nonexistent');

  assertEqual(result.ok, false, 'ok=false');
  assert(result.reason.indexOf('未知作物') >= 0, 'reason 包含未知作物');
});

// =====================================================================
// Section 3: 生长与枯萎 (C3, 4 tests)
// =====================================================================
section('能力 3：生长与枯萎 (C3)');

test('C3-S1: 生长完成→ready — elapsed >= actualGrowthTime 后转为 ready', function() {
  resetAll();
  Math.random = function() { return 0.99; }; // avoid bug trigger
  var crop = CropData['cabbage']; // growthTime=180
  plantOnPlot(0, 'cabbage');
  // Set plantedAt far in past (well past growth time)
  var gardenLevel = 3; // speedBonus=0.10
  var actualTime = crop.growthTime / (1 + 0.10); // ~163.6s
  FarmManager._state.plots[0].plantedAt = Date.now() - (actualTime * 1000 + 2000);
  _emitted = [];

  FarmManager.onTick(1);
  Math.random = _origRandom;

  var plot = FarmManager._state.plots[0];
  assertEqual(plot.state, 'ready', 'state 应为 ready');
  assert(typeof plot.readyAt === 'number' && plot.readyAt > 0, 'readyAt 已设置');

  var events = getEmitted('farm:crop_ready');
  assertEqual(events.length, 1, '应 emit farm:crop_ready');
  assertEqual(events[0].data.plotIndex, 0, '载荷 plotIndex=0');
  assertEqual(events[0].data.cropId, 'cabbage', '载荷 cropId=cabbage');
});

test('C3-S2: 枯萎 48h — ready 超过 48 小时后重置为 idle', function() {
  resetAll();
  setPlotReady(0, 'cabbage');
  // Set readyAt to 49 hours ago (> 48h threshold)
  FarmManager._state.plots[0].readyAt = Date.now() - (49 * 3600 * 1000);
  _emitted = [];

  FarmManager.onTick(1);

  var plot = FarmManager._state.plots[0];
  assertEqual(plot.state, 'idle', 'state 重置为 idle');
  assertEqual(plot.cropId, null, 'cropId=null');
  assertEqual(plot.plantedAt, null, 'plantedAt=null');
  assertEqual(plot.readyAt, null, 'readyAt=null');
  assertEqual(plot.watered, false, 'watered=false');
  assertEqual(plot.fertilized, false, 'fertilized=false');
  assertEqual(plot.hasBug, false, 'hasBug=false');
  assertEqual(plot.bugTriggered, false, 'bugTriggered=false');
  assertEqual(plot.remainHarvests, 0, 'remainHarvests=0');
  assertEqual(plot.isReharvest, false, 'isReharvest=false (BUG-03 修复)');

  var events = getEmitted('farm:withered');
  assertEqual(events.length, 1, '应 emit farm:withered');
  assertEqual(events[0].data.plotIndex, 0, '载荷 plotIndex=0');
});

test('C3-S3: 离线补算 — 离线 2 小时后上线首次 tick 即检测到成熟', function() {
  resetAll();
  Math.random = function() { return 0.99; }; // avoid bug trigger
  var crop = CropData['cabbage']; // growthTime=180s
  plantOnPlot(0, 'cabbage');
  // 离线 2 小时 = 7200s >> 180s
  FarmManager._state.plots[0].plantedAt = Date.now() - (2 * 3600 * 1000);
  _emitted = [];

  FarmManager.onTick(1);
  Math.random = _origRandom;

  var plot = FarmManager._state.plots[0];
  assertEqual(plot.state, 'ready', '离线后首次 tick 立即 ready');
});

test('C3-S4: 菜园未建造 — gardenLevel=0 时 onTick 不处理', function() {
  resetAll();
  TownManager.setLevel('vegetable_garden', 0);
  // Manually add a plot for testing (shouldn't be processed)
  FarmManager._state.plots = [{
    cropId: 'cabbage', state: 'growing',
    plantedAt: Date.now() - 999999, readyAt: null,
    watered: false, fertilized: false,
    hasBug: false, bugTriggered: false,
    remainHarvests: 0, isReharvest: false
  }];
  _emitted = [];

  FarmManager.onTick(1);

  // onTick should return early, not transition any plots
  assertEqual(FarmManager._state.plots[0].state, 'growing', 'state 未变化');
  assertEqual(getEmitted('farm:crop_ready').length, 0, '无事件');
});

// =====================================================================
// Section 4: 收获 (C4, 7 tests)
// =====================================================================
section('能力 4：收获 (C4)');

test('C4-S1: harvest 正常 — 发放资源 + inventory += 1 + farmExp', function() {
  resetAll();
  // Use doubleChance=0 garden level to avoid double
  // garden level=3, doubleChance=0
  Math.random = function() { return 0.99; }; // safety
  setPlotReady(0, 'cabbage'); // yields={food:5}, farmExp=5
  ResourceManager.reset();
  _emitted = [];

  var result = FarmManager.harvest(0);
  Math.random = _origRandom;

  assertEqual(result.ok, true, 'ok=true');
  // yieldMultiplier=1 (no bug, no auto, no fertilizer, mastery level 0 bonus=0, doubleChance=0)
  // food = floor(5 * 1) = 5
  assertEqual(result.yields.food, 5, 'yields.food=5');
  assertEqual(result.isDouble, false, 'isDouble=false');

  // ResourceManager.add was called
  var foodAdds = ResourceManager._addLog.filter(function(e) { return e.type === 'food'; });
  assert(foodAdds.length >= 1, 'add food 被调用');
  assertEqual(foodAdds[0].amount, 5, 'add food amount=5');

  // inventory
  assertEqual(FarmManager._state.inventory['cabbage'], 1, 'inventory.cabbage=1');

  // farmExp
  assertEqual(FarmManager._state.farmExp, 5, 'farmExp += 5');

  // plot reset to idle
  assertEqual(FarmManager._state.plots[0].state, 'idle', 'plot 重置为 idle');

  // event
  var events = getEmitted('farm:harvested');
  assertEqual(events.length, 1, '应 emit farm:harvested');
  assertEqual(events[0].data.cropId, 'cabbage', '载荷 cropId');
});

test('C4-S2: harvest 虫害减产 — hasBug=true 时 yields×0.7', function() {
  resetAll();
  Math.random = function() { return 0.99; }; // no double
  setPlotReady(0, 'radish'); // yields={food:8, gold:20}, farmExp=8
  FarmManager._state.plots[0].hasBug = true;
  ResourceManager.reset();
  _emitted = [];

  var result = FarmManager.harvest(0);
  Math.random = _origRandom;

  assertEqual(result.ok, true, 'ok=true');
  // yieldMultiplier = 1 * 0.7 = 0.7
  // food = floor(8 * 0.7) = floor(5.6) = 5
  // gold = floor(20 * 0.7) = floor(14) = 14
  assertEqual(result.yields.food, 5, 'food = floor(8*0.7) = 5');
  assertEqual(result.yields.gold, 14, 'gold = floor(20*0.7) = 14');
});

test('C4-S3: harvest 自动收获 — isAuto=true 时 yields×0.8', function() {
  resetAll();
  Math.random = function() { return 0.99; }; // no double
  setPlotReady(0, 'radish'); // yields={food:8, gold:20}
  ResourceManager.reset();
  _emitted = [];

  var result = FarmManager.harvest(0, true);
  Math.random = _origRandom;

  assertEqual(result.ok, true, 'ok=true');
  // yieldMultiplier = 1 * 0.8 = 0.8
  // food = floor(8 * 0.8) = floor(6.4) = 6
  // gold = floor(20 * 0.8) = floor(16) = 16
  assertEqual(result.yields.food, 6, 'food = floor(8*0.8) = 6');
  assertEqual(result.yields.gold, 16, 'gold = floor(20*0.8) = 16');
});

test('C4-S4: harvest 施肥增产 — fertilized=true, compost_pit=3 → ×1.15', function() {
  resetAll();
  TownManager.setLevel('compost_pit', 3);
  Math.random = function() { return 0.99; }; // no double
  setPlotReady(0, 'cabbage'); // yields={food:5}
  FarmManager._state.plots[0].fertilized = true;
  ResourceManager.reset();
  _emitted = [];

  var result = FarmManager.harvest(0);
  Math.random = _origRandom;

  assertEqual(result.ok, true, 'ok=true');
  // yieldMultiplier = 1 * (1 + 3*0.05) = 1.15
  // food = floor(5 * 1.15) = floor(5.75) = 5
  assertEqual(result.yields.food, 5, 'food = floor(5*1.15) = 5');

test('C4-S5: harvest 双倍 — Math.random < doubleChance → yields×2 + toast', function() {
  resetAll();
  TownManager.setLevel('vegetable_garden', 4); // doubleChance=0.05
  // Re-init to get 5 plots
  FarmManager.init({});
  Math.random = function() { return 0; }; // always hit double
  setPlotReady(0, 'cabbage'); // yields={food:5}
  ResourceManager.reset();
  _emitted = [];

  var result = FarmManager.harvest(0);
  Math.random = _origRandom;

  assertEqual(result.ok, true, 'ok=true');
  assertEqual(result.isDouble, true, 'isDouble=true');
  // yieldMultiplier includes ×2 (and mastery bonus 0 at farmExp=0)
  // food = floor(5 * 1 * 2) = 10
  assertEqual(result.yields.food, 10, 'food = floor(5*2) = 10');

  // toast event
  var toasts = getEmitted('toast:show');
  assert(toasts.length >= 1, '应 emit toast:show');
  assertEqual(toasts[0].data.type, 'success', 'toast type=success');
  assert(toasts[0].data.message.indexOf('大丰收') >= 0, 'message 包含大丰收');
});

test('C4-S6: harvest 连续收割 — chives remainHarvests=1 收获后回到 growing', function() {
  resetAll();
  Math.random = function() { return 0.99; }; // no double
  // chives: reharvestCount=1, reharvestTime=120
  setPlotReady(0, 'chives');
  FarmManager._state.plots[0].remainHarvests = 1; // first harvest
  ResourceManager.reset();
  _emitted = [];

  var result = FarmManager.harvest(0);
  Math.random = _origRandom;

  assertEqual(result.ok, true, 'ok=true');

  var plot = FarmManager._state.plots[0];
  assertEqual(plot.state, 'growing', '收获后回到 growing');

  assert(result.reason.indexOf('肥料已满') >= 0, 'reason 包含肥料已满');
});

section('能力 13：出售作物 (C13)');

test('C13-S1: sellCrop 成功 — cabbage×5 → gold = floor(10×0.6)×5 = 30', function() {
  resetAll();
  FarmManager._state.inventory['cabbage'] = 5;
  ResourceManager.reset();
  _emitted = [];

  var result = FarmManager.sellCrop('cabbage', 5);

  assertEqual(result.ok, true, 'ok=true');
  // goldPerCrop = floor(10 * 0.6) = 6; totalGold = 6*5 = 30
  assertEqual(result.gold, 30, 'gold=30');

  // inventory cleared
  assertEqual(FarmManager._state.inventory['cabbage'], undefined, 'inventory.cabbage 已删除');

  // ResourceManager.add called
  var goldAdds = ResourceManager._addLog.filter(function(e) { return e.type === 'gold'; });
  assert(goldAdds.length >= 1, 'add gold 被调用');
  assertEqual(goldAdds[0].amount, 30, 'add 30 gold');

  var events = getEmitted('farm:crop_sold');
  assertEqual(events.length, 1, '应 emit farm:crop_sold');
  assertEqual(events[0].data.cropId, 'cabbage', '载荷 cropId');
  assertEqual(events[0].data.count, 5, '载荷 count=5');
  assertEqual(events[0].data.gold, 30, '载荷 gold=30');
});

section('能力 14：查询 API (C14)');

test('C14-S1: getActiveBuff 有效 — 返回深拷贝', function() {
  resetAll();
  var now = Date.now();
  FarmManager._state.activeBuff = {
    recipeId: 'vegetable_soup',
    effects: { hpBonus: 0.10 },
    activatedAt: now - 1000, // 1秒前
    duration: 1800 // 30 分钟
  };

  var buff = FarmManager.getActiveBuff();

  assert(buff !== null, '不为 null');
  assertEqual(buff.recipeId, 'vegetable_soup', 'recipeId');
  assertEqual(buff.effects.hpBonus, 0.10, 'hpBonus=0.10');
  assertEqual(buff.duration, 1800, 'duration=1800');

  // Verify deep clone
  buff.effects.hpBonus = 999;
  var buff2 = FarmManager.getActiveBuff();
  assertEqual(buff2.effects.hpBonus, 0.10, '修改返回值不影响内部状态');
});

test('C14-S2: getActiveBuff 过期 — 返回 null + 清除内部状态', function() {
  resetAll();
  FarmManager._state.activeBuff = {
    recipeId: 'vegetable_soup',
    effects: { hpBonus: 0.10 },
    activatedAt: Date.now() - (1801 * 1000), // 超过 1800s duration
    duration: 1800
  };

  var buff = FarmManager.getActiveBuff();

  assertEqual(buff, null, '过期返回 null');
  assertEqual(FarmManager._state.activeBuff, null, '内部 activeBuff 已清除');
});

test('C14-S3: getFarmMastery — farmExp=2000 → title=农耕达人', function() {
  resetAll();
  FarmManager._state.farmExp = 2000;

  var mastery = FarmManager.getFarmMastery();

  assertEqual(mastery.title, '农耕达人', 'title=农耕达人');
  assertEqual(mastery.minExp, 2000, 'minExp=2000');
  assertEqual(mastery.yieldBonus, 0.10, 'yieldBonus=0.10');
  assertEqual(mastery.bugReduction, 0, 'bugReduction=0');
  assertEqual(mastery.extra, 'batchWater', 'extra=batchWater');
});

test('C14-S4: getPlotProgress — growing 田地返回 0-1 之间的值', function() {
  resetAll();
  var crop = CropData['cabbage']; // growthTime=180s
  plantOnPlot(0, 'cabbage');
  // Set plantedAt to roughly half of actual growth time ago
  var gardenLevel = 3; // speedBonus=0.10
  var actualTime = crop.growthTime / (1 + 0.10); // ~163.6s
  var halfElapsed = actualTime / 2; // ~81.8s
  FarmManager._state.plots[0].plantedAt = Date.now() - (halfElapsed * 1000);

  var progress = FarmManager.getPlotProgress(0);

  assert(progress !== null, '不为 null');
  assert(typeof progress === 'number', '应为数字');
  // Should be approximately 0.5 (allow some tolerance for timing)
  assert(progress >= 0.4 && progress <= 0.6, 'progress 约 0.5 (actual=' + progress.toFixed(3) + ')');
});

test('C14-S5: getPlotProgress null — idle 田地返回 null', function() {
  resetAll();
  // plot[0] is idle by default

  var progress = FarmManager.getPlotProgress(0);

  assertEqual(progress, null, 'idle 田地返回 null');
});

test('C14-S6: getRemainingTime — growing 田地返回 > 0 的秒数', function() {
  resetAll();
  var crop = CropData['cabbage']; // growthTime=180s
  plantOnPlot(0, 'cabbage');
  // Set plantedAt to 60 seconds ago
  FarmManager._state.plots[0].plantedAt = Date.now() - (60 * 1000);

  var remaining = FarmManager.getRemainingTime(0);

  assert(typeof remaining === 'number', '应为数字');
  assert(remaining > 0, '剩余时间 > 0');
  // actualGrowthTime for garden level 3 ≈ 163.6s, elapsed 60s → remaining ≈ 103.6s
  var gardenLevel = 3;
  var actualTime = crop.growthTime / (1 + 0.10); // ~163.6
  var expectedRemaining = actualTime - 60;
  assert(Math.abs(remaining - expectedRemaining) < 2, '剩余时间约 ' + expectedRemaining.toFixed(1) + 's (actual=' + remaining.toFixed(1) + ')');
});
