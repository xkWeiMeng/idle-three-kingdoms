<!-- ===== Mock 全局依赖：在模块加载前定义 ===== -->
<script>
// ===== Mock ResourceManager =====
var ResourceManager = {
  _resources: {},
  _spent: [],
  reset: function(r) {
    this._resources = r || { gold: 99999, iron: 99999, wood: 99999, stone: 99999 };
    this._spent = [];
  },
  canAfford: function(type, amount) {
    return (this._resources[type] || 0) >= amount;
  },
  spend: function(type, amount) {
    this._resources[type] = (this._resources[type] || 0) - amount;
    this._spent.push({ type: type, amount: amount });
  }
};

// ===== Mock TownManager =====
var TownManager = {
  _buildings: {},
  reset: function(b) {
    this._buildings = b || { weapon_workshop: 10, blacksmith: 10 };
  },
  getState: function() {
    return { buildings: this._buildings };
  }
};

// ===== Mock EquipmentManager =====
var EquipmentManager = {
  _inventory: [],
  _overflow: [],
  _maxSlots: 50,
  _addCalled: false,
  reset: function() {
    this._inventory = [];
    this._overflow = [];
    this._maxSlots = 50;
    this._addCalled = false;
  },
  addToInventory: function(equip) {
    this._addCalled = true;
    if (!equip) return false;
    if (this._inventory.length < this._maxSlots) {
      this._inventory.push(equip);
      return true;
    }
    if (this._overflow.length < 10) {
      this._overflow.push(equip);
      return true;
    }
    return false;
  }
};

// ===== Mock EquipmentData =====
var EquipmentData = [
  { id: 'eq_g1', name: '铁剑', type: 'weapon', quality: 2, statType: 'atk', statRange: [3, 8], emoji: '🗡️' },
  { id: 'eq_g2', name: '铁甲', type: 'armor', quality: 2, statType: 'def', statRange: [2, 5], emoji: '🛡️' },
  { id: 'eq_b1', name: '霜寒枪', type: 'weapon', quality: 3, statType: 'atk', statRange: [15, 25], emoji: '🔱' }
];

// ===== Mock BlueprintData =====
var BlueprintData = {
  'bp_001': { name: '青龙偃月刀·图纸', equipId: 'eq_m01', emoji: '⚔️', setId: 'set_01' },

function getMythicTemplate(equipId) {
  if (equipId === 'eq_m01') {
    return { id: 'eq_m01', name: '青龙偃月刀', type: 'weapon', quality: 6, emoji: '⚔️',
             statType: 'atk', statRange: [50, 80], setId: 'set_01', description: '神话武器' };
  }
  return null;  // eq_m02 deliberately returns null for testing
}

// ===== Mock EquipmentSets (UI dependency) =====
var EquipmentSets = {
  'set_01': { name: '关羽之魂' },
  'set_02': { name: '吕布之怒' }
};

<script>
/**
 * 规范引用：specs/services/forge-manager.md
 * 执行计划：specs/exec-plans/forge-manager.md
 *
 * 测试策略：
 *   - Mock ResourceManager / TownManager / EquipmentManager（全局 var 覆盖）
 *   - Mock EquipmentData / BlueprintData / getMythicTemplate（数据文件不加载）
 *   - 拦截 EventBus.emit，记录所有事件调用
 *   - 每个测试前执行 resetFM() 清空状态
 */

// ===== 微型测试框架 =====
var _results = [];
var _log = document.getElementById('results');
var _currentSection = '';

function section(name) {
  _currentSection = name;
  var el = document.createElement('div');
  el.className = 'section';
  el.textContent = '▸ ' + name;
  _log.appendChild(el);
}

function test(name, fn) {
  var el = document.createElement('div');
  try {
    fn();
    el.className = 'pass';
    el.textContent = '  ✅ ' + name;
    _results.push({ name: name, pass: true });
  } catch (e) {
    el.className = 'fail';
    el.textContent = '  ❌ ' + name + ' — ' + e.message;
    _results.push({ name: name, pass: false, error: e.message });
  }
  _log.appendChild(el);
}

function assert(cond, msg) {
  if (!cond) throw new Error(msg || 'Assertion failed');
}

function assertEqual(a, b, msg) {
  if (a !== b) throw new Error((msg || '') + ' expected ' + JSON.stringify(b) + ' got ' + JSON.stringify(a));
}

// ===== EventBus 拦截 =====
var _emitted = [];
var _origEmit = EventBus.emit.bind(EventBus);
EventBus.emit = function(event) {
  var args = Array.prototype.slice.call(arguments, 1);
  _emitted.push({ event: event, payload: args[0] });
  _origEmit.apply(null, arguments);
};

function clearEmits() { _emitted.length = 0; }
function getEmits(event) {
  return _emitted.filter(function(e) { return e.event === event; });
}

// ===== ForgeManager 重置 =====
function resetFM() {
  ForgeManager._state = { queue: [], maxQueue: 1, blueprints: [] };
  ResourceManager.reset();
  TownManager.reset();
  EquipmentManager.reset();
  clearEmits();
}

// ===============================================================
// 能力 1：普通锻造（5 个场景）
// ===============================================================
section('能力1 普通锻造 startNormalForge');

test('C1-S1: 正常启动绿色锻造 — 扣资源，入队，emit，return true', function() {
  resetFM();
  ResourceManager.reset({ gold: 1000, iron: 200, wood: 0, stone: 0 });
  TownManager.reset({ weapon_workshop: 1, blacksmith: 1 });

  var result = ForgeManager.startNormalForge(0);
  assertEqual(result, true, 'return');
  assertEqual(ForgeManager._state.queue.length, 1, 'queue length');
  assertEqual(ForgeManager._state.queue[0].recipeId, 'normal_q2', 'recipeId');
  assertEqual(ForgeManager._state.queue[0].quality, 2, 'quality');
  assertEqual(ForgeManager._state.queue[0].totalTime, 600, 'totalTime');
  assertEqual(ForgeManager._state.queue[0].elapsedTime, 0, 'elapsedTime');
  // Check resource deduction
  var goldSpent = ResourceManager._spent.filter(function(s) { return s.type === 'gold'; });
  var ironSpent = ResourceManager._spent.filter(function(s) { return s.type === 'iron'; });
  assertEqual(goldSpent[0].amount, 500, 'gold spent');
  assertEqual(ironSpent[0].amount, 100, 'iron spent');
  // Check events
  assert(getEmits('forge:started').length === 1, 'forge:started emitted');
  assertEqual(getEmits('forge:started')[0].payload.totalTime, 600, 'forge:started totalTime');
  assert(getEmits('toast:show').length === 1, 'toast emitted');
  assertEqual(getEmits('toast:show')[0].payload.type, 'info', 'toast type');
});

test('C1-S2: 队列已满 → toast warning, return false', function() {
  resetFM();
  ForgeManager._state.queue.push({ recipeId: 'normal_q2', completed: false, elapsedTime: 0, totalTime: 600, quality: 2 });

  var result = ForgeManager.startNormalForge(0);
  assertEqual(result, false, 'return');
  assertEqual(ForgeManager._state.queue.length, 1, 'queue unchanged');
  assert(getEmits('toast:show').length === 1, 'toast emitted');
  assert(getEmits('toast:show')[0].payload.message.indexOf('队列已满') >= 0, 'toast message');
  assertEqual(ResourceManager._spent.length, 0, 'no resource spent');
});

test('C1-S3: 建筑等级不足 → toast warning, return false', function() {
  resetFM();
  TownManager.reset({ weapon_workshop: 2, blacksmith: 2 });

  var result = ForgeManager.startNormalForge(1); // 蓝色需要等级3
  assertEqual(result, false, 'return');
  assert(getEmits('toast:show').length === 1, 'toast emitted');
  assert(getEmits('toast:show')[0].payload.message.indexOf('等级') >= 0, 'toast mentions level');
  assertEqual(ResourceManager._spent.length, 0, 'no resource spent');
});

test('C1-S4: 资源不足 → toast warning, return false', function() {
  resetFM();
  ResourceManager.reset({ gold: 100, iron: 0, wood: 0, stone: 0 });  // gold=100 < 500
  TownManager.reset({ weapon_workshop: 1, blacksmith: 1 });

  var result = ForgeManager.startNormalForge(0);
  assertEqual(result, false, 'return');
  assert(getEmits('toast:show').length === 1, 'toast emitted');
  assert(getEmits('toast:show')[0].payload.message.indexOf('资源不足') >= 0, 'toast message');
  assertEqual(ResourceManager._spent.length, 0, 'no resource spent');
});

test('C1-S5: qualityIndex=99 越界 → return false, 无 toast', function() {
  resetFM();

  var result = ForgeManager.startNormalForge(99);
  assertEqual(result, false, 'return');
  assertEqual(getEmits('toast:show').length, 0, 'no toast');
  assertEqual(ForgeManager._state.queue.length, 0, 'queue empty');
});

section('能力2 神话锻造 startMythicForge');

test('C2-S4: BlueprintData 中不存在 → return false', function() {

test('C3-S2: 普通锻造完成 — 生成装备，入背包，emit', function() {

  ForgeManager._state.queue.push({

test('C3-S4: 神话锻造，资源充足 → 扣资源，emit forge:progress', function() {

    recipeId: 'eq_m01', blueprintId: 'bp_001', quality: 6, label: '青龙偃月刀·图纸',

    totalCost: { gold: 36000, iron: 7200, wood: 3600, stone: 2400 },

  var job = ForgeManager._state.queue[0];
  assertEqual(job.elapsedTime, 1, 'elapsedTime incremented');

  assert(ResourceManager._spent.length > 0, 'resources spent');

  assertEqual(getEmits('forge:progress')[0].payload.percent, 0, 'progress 0% at start');

test('C3-S6: 神话锻造已暂停，资源恢复 → paused=false，继续消耗', function() {

test('C6-S1: init(undefined) → 默认空状态', function() {
  ForgeManager.init(undefined);

  assertEqual(ForgeManager._state.queue.length, 0, 'empty queue');
  assertEqual(ForgeManager._state.maxQueue, 1, 'maxQueue=1');
  assertEqual(ForgeManager._state.blueprints.length, 0, 'empty blueprints');
});

test('C6-S2: init 恢复存档', function() {
  var saved = {
    forge: {
      queue: [{ recipeId: 'normal_q2', quality: 2, totalTime: 600, elapsedTime: 300, completed: false }],
      maxQueue: 2,
      blueprints: ['bp_001', 'bp_002']
    }
  };

  ForgeManager.init(saved);

  assertEqual(ForgeManager._state.queue.length, 1, 'queue restored');
  assertEqual(ForgeManager._state.queue[0].recipeId, 'normal_q2', 'job restored');
  assertEqual(ForgeManager._state.maxQueue, 2, 'maxQueue restored');
  assertEqual(ForgeManager._state.blueprints.length, 2, 'blueprints restored');
});

test('C6-S3: getState() 含神话任务 → mythicForge 正确提取', function() {
  resetFM();
  ForgeManager._state.queue.push({
    recipeId: 'eq_m01', blueprintId: 'bp_001', quality: 6, label: '青龙偃月刀·图纸',
    totalTime: 86400, elapsedTime: 3600, paused: false, completed: false,
    totalCost: { gold: 36000, iron: 7200, wood: 3600, stone: 2400 },
    consumed: { gold: 1500, iron: 300, wood: 150, stone: 100 }
  });

  var state = ForgeManager.getState();

  assert(state.mythicForge, 'mythicForge exists');
  assertEqual(state.mythicForge.blueprintId, 'bp_001', 'blueprintId from blueprintId field');
  assertEqual(state.mythicForge.progress, 3600, 'progress from elapsedTime');
  assertEqual(state.mythicForge.requiredTime, 86400, 'requiredTime from totalTime');
  assertEqual(state.mythicForge.paused, false, 'paused');
  // Verify deep clone (queue)
  assert(state.queue !== ForgeManager._state.queue, 'queue is deep clone');
  assertEqual(state.queue.length, 1, 'queue length');
  // Verify blueprints is a copy
  assert(state.blueprints !== ForgeManager._state.blueprints, 'blueprints is copy');
});

test('C6-S4: getState() 无神话任务 → mythicForge = {}', function() {
  resetFM();
  ForgeManager._state.queue.push({

  });

  var state = ForgeManager.getState();

  assertEqual(Object.keys(state.mythicForge).length, 0, 'mythicForge is empty');
  assertEqual(state.queue.length, 1, 'queue has normal item');
});

// ===============================================================
var passed = _results.filter(function(r) { return r.pass; }).length;
var total = _results.length;
var summaryEl = document.getElementById('summary');
summaryEl.innerHTML = '<strong>结果：' + passed + '/' + total + ' PASS</strong>';
if (passed === total) {
  summaryEl.innerHTML += ' <span class="pass">✅ ALL PASS</span>';
} else {
  summaryEl.innerHTML += ' <span class="fail">❌ ' + (total - passed) + ' FAILED</span>';
  var fails = _results.filter(function(r) { return !r.pass; });
  for (var f = 0; f < fails.length; f++) {
    summaryEl.innerHTML += '<br><span class="fail">  • ' + fails[f].name + ': ' + fails[f].error + '</span>';
  }
}
