// ===== 微型测试框架 =====
var _results = [];
var _log = document.getElementById('results');
var _currentSection = '';

function section(name) {
  _currentSection = name;
  var el = document.createElement('div');
  el.className = 'section';
  el.textContent = '▸ ' + name;
  _log.appendChild(el);
}

function test(name, fn) {
  var entry = { section: _currentSection, name: name, status: 'pass', error: null };
  try {
    fn();
  } catch (e) {
    entry.status = 'fail';
    entry.error = e.message || String(e);
  }
  _results.push(entry);
  var el = document.createElement('div');
  el.className = entry.status;
  el.textContent = (entry.status === 'pass' ? '  ✓ ' : '  ✗ ') + name;
  if (entry.error) el.textContent += ' — ' + entry.error;
  _log.appendChild(el);
}

function assert(condition, msg) {
  if (!condition) throw new Error(msg || 'Assertion failed');
}

function assertEqual(actual, expected, msg) {
  if (actual !== expected) {
    throw new Error((msg || '') + ' expected=' + JSON.stringify(expected) + ' actual=' + JSON.stringify(actual));
  }
}

function assertDeepEqual(actual, expected, msg) {
  if (JSON.stringify(actual) !== JSON.stringify(expected)) {
    throw new Error((msg || '') + ' expected=' + JSON.stringify(expected) + ' actual=' + JSON.stringify(actual));
  }
}

// ===== Mock EventBus — 拦截 emit，记录调用 =====
var _emitted = [];
var _origEmit = EventBus.emit.bind(EventBus);
EventBus.emit = function(event) {
  var args = Array.prototype.slice.call(arguments, 1);
  _emitted.push({ event: event, args: args });
};

function getEmitted(eventName) {
  return _emitted.filter(function(e) { return e.event === eventName; });
}

function resetEmitted() {
  _emitted = [];
}

// ===== Mock ResourceManager =====

    this._resources[type] = (this._resources[type] || 0) + amount;
  },
  spend: function(type, amount) {
    this._resources[type] = (this._resources[type] || 0) - amount;
    this._spent.push({ type: type, amount: amount });
  },
  canAfford: function(type, amount) {
    return (this._resources[type] || 0) >= amount;
  },
  get: function(type) {
    return this._resources[type] || 0;
  },
  reset: function() {
    this._resources = {};
    this._spent = [];
  }
};

<!-- 被测模块 -->
<script src="../js/modules/merchant-manager.js"></script>

<script>
// ===== 测试辅助 =====
function resetAll() {
  MerchantManager._state.lastRefresh = 0;
  MerchantManager._state.refreshInterval = 14400;
  MerchantManager._state.normalStock = [];
  MerchantManager._state.permanentStock = [];
  MerchantManager._state.permanentSold = {};
  ResourceManager.reset();
  EquipmentManager.reset();
  resetEmitted();
}

function nowSec() {
  return Math.floor(Date.now() / 1000);
}

// ================================================================
// 能力 1：初始化与存档 (4 个场景)
// ================================================================
section('能力 1：初始化与存档');

test('C1-S1: init 恢复存档（未过期）— normalStock 恢复，不刷新', function() {
  resetAll();
  var now = nowSec();
  var savedStock = [
    { uid: 'item1', templateId: 'equip_iron_sword', name: '铁剑', emoji: '🗡️', type: 'weapon', quality: 1, statType: 'atk', statValue: 5, description: '普通的铁剑', price: 190, sold: false },
    { uid: 'item2', templateId: 'equip_green_blade', name: '碧刃', emoji: '⚔️', type: 'weapon', quality: 2, statType: 'atk', statValue: 12, description: '泛着绿光的利刃', price: 480, sold: false },
    { uid: 'item3', templateId: 'equip_cloth_robe', name: '布衣', emoji: '👕', type: 'armor', quality: 1, statType: 'def', statValue: 4, description: '布衣', price: 185, sold: false },
    { uid: 'item4', templateId: 'equip_leather_armor', name: '皮甲', emoji: '🧥', type: 'armor', quality: 2, statType: 'def', statValue: 10, description: '皮甲', price: 470, sold: true },
    { uid: 'item5', templateId: 'equip_donkey', name: '毛驴', emoji: '🐴', type: 'mount', quality: 1, statType: 'spd', statValue: 3, description: '毛驴', price: 200, sold: false },
    { uid: 'item6', templateId: 'equip_wooden_ring', name: '木戒', emoji: '💍', type: 'accessory', quality: 1, statType: 'hp', statValue: 20, description: '木戒', price: 170, sold: false }
  ];
  var saved = {
    merchant: {
      lastRefresh: now - 100, // 仅 100 秒前刷新，未过期
      normalStock: savedStock,
      permanentSold: { 'equip_mythic_tyrant_pendant': true }
    }
  };
  resetEmitted();

  MerchantManager.init(saved);

  // normalStock 恢复原值（未刷新）
  assertEqual(MerchantManager._state.normalStock.length, 6, 'normalStock 恢复 6 件');
  assertEqual(MerchantManager._state.normalStock[0].uid, 'item1', '第一件 uid 保留');
  assertEqual(MerchantManager._state.normalStock[3].sold, true, '第四件 sold=true 保留');

  // permanentSold 恢复
  assertEqual(MerchantManager._state.permanentSold['equip_mythic_tyrant_pendant'], true, 'permanentSold 恢复');

  // 对应 permanentStock 条目的 sold=true
  var ps = MerchantManager._state.permanentStock;
  var tyrantItem = null;
  for (var i = 0; i < ps.length; i++) {
    if (ps[i].equipId === 'equip_mythic_tyrant_pendant') tyrantItem = ps[i];
  }
  assert(tyrantItem !== null, '应找到 tyrant pendant');
  assertEqual(tyrantItem.sold, true, 'permanentStock 对应 sold=true');

  // 未触发刷新事件（因为存档未过期且有商品）
  var refreshEvents = getEmitted('merchant:refreshed');
  assertEqual(refreshEvents.length, 0, '未过期不触发刷新');
});

test('C1-S2: init(undefined) 首次游戏 — 空存档触发刷新生成 6 件', function() {
  resetAll();
  resetEmitted();

  MerchantManager.init(undefined);

  // 默认值
  assertEqual(MerchantManager._state.refreshInterval, 14400, 'refreshInterval=14400');

  // normalStock 为空会触发刷新
  assert(MerchantManager._state.normalStock.length > 0, '应触发刷新生成商品');
  assert(MerchantManager._state.normalStock.length <= 6, '商品数 ≤ 6');

  // permanentStock 全部 sold=false
  var ps = MerchantManager._state.permanentStock;
  for (var i = 0; i < ps.length; i++) {
    assertEqual(ps[i].sold, false, 'permanentStock[' + i + '].sold=false');
  }

  // permanentSold 为空
  assertDeepEqual(MerchantManager._state.permanentSold, {}, 'permanentSold={}');

  // 刷新事件
  var refreshEvents = getEmitted('merchant:refreshed');
  assertEqual(refreshEvents.length, 1, '应触发 1 次 merchant:refreshed');
});

test('C1-S3: init 存档已过期 — 立即执行刷新', function() {
  resetAll();
  var now = nowSec();
  var saved = {
    merchant: {
      lastRefresh: now - 20000, // 超过 14400 秒
      normalStock: [{ uid: 'old1', templateId: 'equip_iron_sword', name: '铁剑', emoji: '🗡️', type: 'weapon', quality: 1, statType: 'atk', statValue: 5, description: '普通的铁剑', price: 190, sold: false }]
    }
  };
  resetEmitted();

  MerchantManager.init(saved);

  // 应触发刷新，normalStock 被替换
  var stock = MerchantManager._state.normalStock;
  // 旧的 'old1' 应被替换
  var hasOld = false;
  for (var i = 0; i < stock.length; i++) {
    if (stock[i].uid === 'old1') hasOld = true;
  }
  assertEqual(hasOld, false, '旧商品被替换');
  assert(stock.length <= 6, '新商品数 ≤ 6');

  // lastRefresh 更新为近期
  var diff = nowSec() - MerchantManager._state.lastRefresh;
  assert(diff <= 2, 'lastRefresh 更新为当前时间');

  // 刷新事件
  var refreshEvents = getEmitted('merchant:refreshed');
  assertEqual(refreshEvents.length, 1, '应触发 merchant:refreshed');
});

test('C1-S4: getState 深拷贝 — 修改返回值不影响内部状态', function() {
  resetAll();
  MerchantManager.init(undefined);
  resetEmitted();

  var state = MerchantManager.getState();

  // 验证结构
  assert(typeof state.lastRefresh === 'number', 'lastRefresh 为数字');
  assert(Array.isArray(state.normalStock), 'normalStock 为数组');
  assert(typeof state.permanentSold === 'object', 'permanentSold 为对象');
  assertEqual(state.refreshInterval, 14400, 'refreshInterval=14400');

  // getState() 不包含 permanentStock
  assertEqual(state.permanentStock, undefined, 'getState 不含 permanentStock');

  // 深拷贝：修改返回值不影响内部
  var origLen = MerchantManager._state.normalStock.length;
  state.normalStock.push({ uid: 'fake' });
  assertEqual(MerchantManager._state.normalStock.length, origLen, '修改返回值不影响内部 normalStock');

  state.permanentSold['fake_key'] = true;
  assertEqual(MerchantManager._state.permanentSold['fake_key'], undefined, '修改返回值不影响内部 permanentSold');
});

// ================================================================
// 能力 2：库存自动刷新 (2 个场景)
// ================================================================
section('能力 2：库存自动刷新');

test('C2-S1: onTick 未到刷新时间 — normalStock 不变，无事件', function() {
  resetAll();
  // 先初始化得到一组商品
  MerchantManager.init(undefined);
  var origStock = MerchantManager._state.normalStock.slice();
  resetEmitted();

  // 设置 lastRefresh 为 "刚刚"，确保不会过期
  MerchantManager._state.lastRefresh = nowSec();

  MerchantManager.onTick(1);

  // normalStock 应保持不变（uid 列表相同）
  assertEqual(MerchantManager._state.normalStock.length, origStock.length, 'normalStock 长度不变');
  for (var i = 0; i < origStock.length; i++) {
    assertEqual(MerchantManager._state.normalStock[i].uid, origStock[i].uid, 'item[' + i + '] uid 不变');
  }

  // 无刷新事件
  var refreshEvents = getEmitted('merchant:refreshed');
  assertEqual(refreshEvents.length, 0, '无 merchant:refreshed 事件');
});

test('C2-S2: onTick 到刷新时间 — normalStock 替换，emit merchant:refreshed', function() {
  resetAll();
  MerchantManager.init(undefined);
  var origUids = MerchantManager._state.normalStock.map(function(it) { return it.uid; });
  resetEmitted();

  // 设置 lastRefresh 为很久之前，使其过期
  MerchantManager._state.lastRefresh = nowSec() - 20000;

  MerchantManager.onTick(1);

  // normalStock 应被替换（新的 uid）
  var newUids = MerchantManager._state.normalStock.map(function(it) { return it.uid; });
  var allDifferent = true;
  // 至少有一个不同（新生成的 uid 不太可能碰撞）
  for (var i = 0; i < origUids.length && i < newUids.length; i++) {
    if (origUids[i] !== newUids[i]) { allDifferent = true; break; }
  }
  assert(allDifferent, '商品已替换（uid 不同）');

  // lastRefresh 更新
  var diff = nowSec() - MerchantManager._state.lastRefresh;
  assert(diff <= 2, 'lastRefresh 更新为当前时间');

  // 刷新事件
  var refreshEvents = getEmitted('merchant:refreshed');
  assertEqual(refreshEvents.length, 1, '应 emit merchant:refreshed');
  assert(refreshEvents[0].args[0].stock !== undefined, '事件载荷含 stock');
});

// ================================================================
// 能力 3：手动刷新 (2 个场景)
// ================================================================
section('能力 3：手动刷新');

test('C3-S1: manualRefresh 玉璧充足 — 扣 30 玉璧，刷新商品', function() {
  resetAll();
  MerchantManager.init(undefined);
  var origUids = MerchantManager._state.normalStock.map(function(it) { return it.uid; });
  resetEmitted();

  // 给足够的玉璧
  ResourceManager._resources.jade = 100;

  var result = MerchantManager.manualRefresh();

  assertEqual(result, true, '返回 true');

  // 扣除 30 玉璧
  var jadeSpent = ResourceManager._spent.filter(function(s) { return s.type === 'jade'; });
  assertEqual(jadeSpent.length, 1, '应调用 spend jade');
  assertEqual(jadeSpent[0].amount, 30, '扣除 30 玉璧');

  // normalStock 已替换
  assert(MerchantManager._state.normalStock.length <= 6, '新商品数 ≤ 6');

  // lastRefresh 更新
  var diff = nowSec() - MerchantManager._state.lastRefresh;
  assert(diff <= 2, 'lastRefresh 更新');

  // 事件
  var refreshEvents = getEmitted('merchant:refreshed');
  assertEqual(refreshEvents.length, 1, '应 emit merchant:refreshed');

  var toasts = getEmitted('toast:show');
  var successToast = toasts.filter(function(t) { return t.args[0].type === 'success'; });
  assertEqual(successToast.length, 1, '应 emit toast:show success');
  assert(successToast[0].args[0].message.indexOf('商铺已刷新') >= 0, 'message 包含 商铺已刷新');
});

test('C3-S2: manualRefresh 玉璧不足 — 返回 false，不刷新', function() {
  resetAll();
  MerchantManager.init(undefined);
  var origStock = MerchantManager._state.normalStock.slice();
  var origLastRefresh = MerchantManager._state.lastRefresh;
  resetEmitted();

  // 玉璧不足
  ResourceManager._resources.jade = 10;

  var result = MerchantManager.manualRefresh();

  assertEqual(result, false, '返回 false');

  // normalStock 不变
  assertEqual(MerchantManager._state.normalStock.length, origStock.length, 'normalStock 长度不变');
  for (var i = 0; i < origStock.length; i++) {
    assertEqual(MerchantManager._state.normalStock[i].uid, origStock[i].uid, 'item[' + i + '] 不变');
  }

  // lastRefresh 不变
  assertEqual(MerchantManager._state.lastRefresh, origLastRefresh, 'lastRefresh 不变');

  // jade 不扣
  assertEqual(ResourceManager._spent.length, 0, 'jade 不扣');

  // toast warning
  var toasts = getEmitted('toast:show');
  assertEqual(toasts.length, 1, '应 emit toast:show');
  assertEqual(toasts[0].args[0].type, 'warning', 'toast type=warning');
  assert(toasts[0].args[0].message.indexOf('玉璧不足') >= 0, 'message 包含 玉璧不足');
  assert(toasts[0].args[0].message.indexOf('30') >= 0, 'message 包含 30');
});

section('能力 4：商品生成规则');

test('C4-S1: 刷新生成 ≤6 件商品，每件有唯一 uid，sold=false', function() {
  resetAll();
  resetEmitted();
  MerchantManager.init(undefined);

  var stock = MerchantManager._state.normalStock;

  assert(stock.length > 0, '应生成至少 1 件商品');
  assert(stock.length <= 6, '商品数 ≤ 6');

  // 每件有唯一 uid
  var uids = {};
  for (var i = 0; i < stock.length; i++) {
    assert(typeof stock[i].uid === 'string' && stock[i].uid.length > 0, 'item[' + i + '] 有 uid');
    assertEqual(uids[stock[i].uid], undefined, 'uid 唯一: ' + stock[i].uid);
    uids[stock[i].uid] = true;
  }

  // 每件 sold=false
  for (var j = 0; j < stock.length; j++) {
    assertEqual(stock[j].sold, false, 'item[' + j + '] sold=false');
  }

  // 每件 type 合法
  var validTypes = ['weapon', 'armor', 'accessory', 'mount'];
  for (var k = 0; k < stock.length; k++) {

    return min;
  };

test('C5-S1: buyNormal 成功购买 — 扣金币、标记售出、创建装备', function() {
  resetAll();
  MerchantManager.init(undefined);
  // 确保有库存
  assert(MerchantManager._state.normalStock.length > 0, '应有库存');

  var item = MerchantManager._state.normalStock[0];
  ResourceManager._resources.gold = item.price + 1000;
  EquipmentManager._maxCapacity = 50;
  EquipmentManager._inventory = [];
  resetEmitted();

  var result = MerchantManager.buyNormal(item.uid);

  assertEqual(result, true, '返回 true');

  // item 标记售出
  assertEqual(item.sold, true, 'item.sold=true');

  // 金币扣除
  var goldSpent = ResourceManager._spent.filter(function(s) { return s.type === 'gold'; });
  assertEqual(goldSpent.length, 1, '应扣金币');
  assertEqual(goldSpent[0].amount, item.price, '扣除金额=' + item.price);

  // 装备添加到背包
  assertEqual(EquipmentManager._added.length, 1, '应添加 1 件装备');
  var equip = EquipmentManager._added[0];
  assert(typeof equip.uid === 'string' && equip.uid.length > 0, '装备有 uid');
  assertEqual(equip.id, item.templateId, '装备 id = templateId');
  assertEqual(equip.name, item.name, '装备 name');
  assertEqual(equip.type, item.type, '装备 type');
  assertEqual(equip.quality, item.quality, '装备 quality');
  assertEqual(equip.level, 0, '装备 level=0');
  assertEqual(equip.equippedBy, null, '装备 equippedBy=null');
  assertEqual(equip.stats[item.statType], item.statValue, '装备 stats');

  // 事件
  var purchasedEvents = getEmitted('merchant:purchased');
  assertEqual(purchasedEvents.length, 1, '应 emit merchant:purchased');
  assertEqual(purchasedEvents[0].args[0].price, item.price, '事件载荷 price');
  assert(purchasedEvents[0].args[0].item !== undefined, '事件载荷 item');

  var toasts = getEmitted('toast:show');
  var successToast = toasts.filter(function(t) { return t.args[0].type === 'success'; });
  assertEqual(successToast.length, 1, '应 emit toast:show success');
  assert(successToast[0].args[0].message.indexOf(item.name) >= 0, 'message 包含装备名');
});
