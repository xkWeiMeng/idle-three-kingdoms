<body>
<h1>TowerDefenseManager 规范测试</h1>
<pre>规范引用：specs/product-specs/tower-defense-system.md (Active v0.3.0)</pre>
<div id="results"></div>

<!-- 加载核心依赖 -->
<script src="../js/core/constants.js"></script>
<script src="../js/core/event-bus.js"></script>

<script>
/**
 * 规范引用：specs/product-specs/tower-defense-system.md
 * 场景覆盖：12 个能力（CAP-TD-01~12）+ 补充场景（存档恢复、新手引导）
 */

// ===== 微型测试框架 =====
var _results = [];
var _log = document.getElementById('results');
var _currentSection = '';

function section(name) {
  _currentSection = name;
  var el = document.createElement('div');
  el.className = 'section';
  el.textContent = '▸ ' + name;
  _log.appendChild(el);
}

function test(name, fn) {
  var entry = { section: _currentSection, name: name, status: 'pass', error: null };
  try {
    fn();
  } catch (e) {
    entry.status = 'fail';
    entry.error = e.message || String(e);
  }
  _results.push(entry);
  var el = document.createElement('div');
  el.className = entry.status;
  el.textContent = (entry.status === 'pass' ? '  ✓ ' : '  ✗ ') + name;
  if (entry.error) el.textContent += ' — ' + entry.error;
  _log.appendChild(el);
}

function skip(name, reason) {
  _results.push({ section: _currentSection, name: name, status: 'skip', error: null });
  var el = document.createElement('div');
  el.className = 'skip';
  el.textContent = '  ⊘ ' + name + ' (' + (reason || '需要 DOM/Canvas') + ')';
  _log.appendChild(el);
}

function assert(condition, msg) {
  if (!condition) throw new Error(msg || 'Assertion failed');
}

function assertEqual(actual, expected, msg) {
  if (actual !== expected) throw new Error((msg || '') + ' expected=' + expected + ' actual=' + actual);
}

function assertApprox(actual, expected, tolerance, msg) {
  if (Math.abs(actual - expected) > tolerance)
    throw new Error((msg || '') + ' expected≈' + expected + ' actual=' + actual);
}

// ===== Mock 依赖 =====
var _emitted = [];
var _origEmit = EventBus.emit;
EventBus.emit = function(event) {
  _emitted.push({ event: event, args: Array.prototype.slice.call(arguments, 1) });
  _origEmit.apply(EventBus, arguments);
};

function clearEmitted() { _emitted = []; }
function findEmitted(event) { return _emitted.filter(function(e) { return e.event === event; }); }

// Mock ResourceManager
var ResourceManager = {
  _resources: { gold: 99999, wood: 9999, stone: 9999, iron: 9999, jade: 999, exp: 0, food: 999 },
  canAffordMultiple: function(costs) {
    for (var k in costs) { if ((this._resources[k] || 0) < costs[k]) return false; }
    return true;
  },
  spendMultiple: function(costs) {
    for (var k in costs) { this._resources[k] = (this._resources[k] || 0) - costs[k]; }
  },
  add: function(type, amount) { this._resources[type] = (this._resources[type] || 0) + amount; },
  canAfford: function(type, amount) { return (this._resources[type] || 0) >= amount; },
  spend: function(type, amount) { this._resources[type] -= amount; },
  _reset: function() { this._resources = { gold: 99999, wood: 9999, stone: 9999, iron: 9999, jade: 999, exp: 0, food: 999 }; }
};

// Mock HeroManager
var HeroManager = {
  _heroes: [],
  _team: [],
  getTeam: function() { return this._team.slice(); },
  getTeamUids: function() { return this._team.map(function(h) { return h.uid; }); },
  getHero: function(uid) { return this._heroes.find(function(h) { return h.uid === uid; }); },
  getHeroStats: function(uid) {
    var h = this.getHero(uid);
    if (!h) return null;
    return { uid: h.uid, id: h.id, atk: h.atk || 100, def: h.def || 50, hp: h.hp || 500, spd: h.spd || 20 };
  },
  getTemplate: function(id) {
    return { id: id, name: '测试武将', skill: { name: '测试技能', multiplier: 1.8 } };
  },
  getAllHeroes: function() { return this._heroes.slice(); },
  _reset: function() { this._heroes = []; this._team = []; }
};

// Mock TownManager
var TownManager = {
  _levels: { town_hall: 3 },
  getBuildingLevel: function(id) { return this._levels[id] || 0; },
  getCollisionGrid: function() {
    var grid = [];
    for (var y = 0; y < 24; y++) {
      grid[y] = [];
      for (var x = 0; x < 24; x++) grid[y][x] = 0;
    }
    // Place town hall at center (11,11) as obstacle
    grid[11][11] = 1;
    grid[11][12] = 1;
    grid[12][11] = 1;
    grid[12][12] = 1;
    return grid;
  },
  _reset: function() { this._levels = { town_hall: 3 }; }
};

// Mock BattleManager
var BattleManager = {
  _state: { currentStage: 'stage_2_10', clearedStages: ['stage_2_10'] },
  getState: function() { return this._state; },
  _reset: function() { this._state = { currentStage: 'stage_2_10', clearedStages: ['stage_2_10'] }; }
};

// Mock EquipmentManager
var EquipmentManager = {
  _inventory: [],
  addToInventory: function(equip) { this._inventory.push(equip); },
  _reset: function() { this._inventory = []; }
};

// Mock TownWorld
var TownWorld = {
  _canvas: null,
  _ctx: null,
  _placements: { town_hall: { gx: 11, gy: 11 } },
  getCollisionGrid: function() { return TownManager.getCollisionGrid(); },
  _draw: function() {},
  TILE: 48,
  _camX: 0, _camY: 0,
  MAP_W: 24, MAP_H: 24
};

// Mock SaveManager
var SaveManager = { save: function() {}, load: function() { return null; } };
</script>

<script src="../js/modules/tower-defense-manager.js"></script>

<script>
// ===== 辅助函数 =====
function resetAll() {
  clearEmitted();
  ResourceManager._reset();
  HeroManager._reset();
  TownManager._reset();
  BattleManager._reset();
  EquipmentManager._reset();
  TowerDefenseManager.init(null);
}

function unlockTD() {
  resetAll();
  TowerDefenseManager._state.unlocked = true;
  TowerDefenseManager._initTownHallHp();
}

// ===== 测试开始 =====

// ========================
section('T1 — 静态数据完整性');
// ========================

test('TDTowerData 含 16 种塔', function() {
  assertEqual(Object.keys(TDTowerData).length, 16);
});

test('TDEnemyData 含 9 种敌人', function() {
  assertEqual(Object.keys(TDEnemyData).length, 9);
});

test('TDWaveTable 含 21 条（index 0 为 null）', function() {
  assertEqual(TDWaveTable.length, 21);
  assertEqual(TDWaveTable[0], null);
});

test('TDTechTree 含 5 条（index 0 为 null）', function() {
  assertEqual(TDTechTree.length, 5);
  assertEqual(TDTechTree[0], null);
});

test('TD_UPGRADE_TABLE 含 6 条（index 0 为 null）', function() {
  assertEqual(TD_UPGRADE_TABLE.length, 6);
  assertEqual(TD_UPGRADE_TABLE[0], null);
});

test('波次 5 为 Boss 波，含攻城车', function() {
  assert(TDWaveTable[5].isBoss === true, 'W5 应为 Boss');
  var hasSiegeRam = TDWaveTable[5].enemies.some(function(e) { return e.type === 'td_siege_ram'; });
  assert(hasSiegeRam, 'W5 应含攻城车');
});

test('波次 20 含终极Boss + 随从', function() {
  assert(TDWaveTable[20].isBoss === true, 'W20 应为 Boss');
  var hasFinalBoss = TDWaveTable[20].enemies.some(function(e) { return e.type === 'td_final_boss'; });
  assert(hasFinalBoss, 'W20 应含终极Boss');
  var totalEnemies = TDWaveTable[20].enemies.reduce(function(s, e) { return s + e.count; }, 0);
  assert(totalEnemies === 5, 'W20 应有 5 个敌人（1 Boss + 4 随从）');
});

test('波次 HP 公式验算（W1=100, W2=112, W10 Boss=831）', function() {
  assertEqual(TDWaveTable[1].baseHp, 100, 'W1 HP');
  assertEqual(TDWaveTable[2].baseHp, 112, 'W2 HP');
  // W10 boss HP = floor(100*1.12^9) * 3 = 277*3 = 831
  assertEqual(TDWaveTable[10].baseHp, 831, 'W10 Boss HP');
});

test('TDWaveRewards 函数存在且返回正确结构', function() {
  var r = TDWaveRewards(1);
  assert(typeof r.gold === 'number', 'gold 应为数字');
  assert(typeof r.exp === 'number', 'exp 应为数字');
  assertEqual(r.gold, 50, 'W1 gold=50');
  assertEqual(r.exp, 15, 'W1 exp=15');
});

// ========================
section('T3 — A* 寻路');
// ========================

test('空旷网格中找到路径', function() {
  var grid = [];
  for (var y = 0; y < 10; y++) { grid[y] = []; for (var x = 0; x < 10; x++) grid[y][x] = 0; }
  var path = Pathfinding.findPath(grid, {x:0,y:0}, {x:9,y:9});
  assert(path !== null, '应找到路径');
  assert(path.length > 0, '路径应有节点');
  assertEqual(path[path.length-1].x, 9, '终点 x=9');
  assertEqual(path[path.length-1].y, 9, '终点 y=9');
});

test('全封锁时返回 null', function() {
  var grid = [];
  for (var y = 0; y < 5; y++) { grid[y] = []; for (var x = 0; x < 5; x++) grid[y][x] = 1; }
  grid[0][0] = 0; grid[4][4] = 0;
  var path = Pathfinding.findPath(grid, {x:0,y:0}, {x:4,y:4});
  assertEqual(path, null, '应返回 null');
});

test('checkPathExists: 开放时返回 true', function() {
  var grid = [];
  for (var y = 0; y < 10; y++) { grid[y] = []; for (var x = 0; x < 10; x++) grid[y][x] = 0; }
  var result = Pathfinding.checkPathExists(grid, 5, 5, [{x:0,y:0}], {x:9,y:9});
  assert(result === true, '应返回 true');
});

test('路径绕过障碍物', function() {
  var grid = [];
  for (var y = 0; y < 5; y++) { grid[y] = []; for (var x = 0; x < 5; x++) grid[y][x] = 0; }
  // 在中间放墙
  grid[2][1] = 1; grid[2][2] = 1; grid[2][3] = 1;
  var path = Pathfinding.findPath(grid, {x:2,y:0}, {x:2,y:4});
  assert(path !== null, '应找到绕路路径');
  // 路径不应穿过 y=2 的墙
  var noWallCross = path.every(function(p) { return !(p.y === 2 && p.x >= 1 && p.x <= 3); });
  assert(noWallCross, '路径不应穿墙');
});

section('§3 解锁条件 / CAP-TD-01 进入防守');
// ========================

test('WHEN 无存档 → 默认状态, unlocked=false', function() {
  TowerDefenseManager.init(null);
  var s = TowerDefenseManager.getState();
  assertEqual(s.unlocked, false, 'unlocked=false');
  assertEqual(s.era, 1, 'era=1');
  assertEqual(s.wave.current, 1, 'wave.current=1');
  assert(Array.isArray(s.towers), 'towers 为数组');
  assertEqual(s.towers.length, 0, 'towers 为空');
});

test('WHEN 有存档 → 恢复所有字段', function() {
  var saved = {
    towerDefense: {
      unlocked: true, era: 2,
      research: { era_2: { completed: true, startTime: null }, era_3: { completed: false, startTime: null }, era_4: { completed: false, startTime: null } },
      towers: [{ uid: 'test1', type: 'td_arrow_tower', level: 3, gridX: 5, gridY: 5 }],
      wave: { current: 8, highest: 7, townHallHp: 900, townHallMaxHp: 1100 },
      assignedHeroes: [], stats: { totalWavesCleared: 7, totalKills: 50, totalGoldEarned: 2000 },
      tutorialSeen: true
    }
  };
  TowerDefenseManager.init(saved);
  var s = TowerDefenseManager.getState();
  assertEqual(s.unlocked, true);
  assertEqual(s.era, 2);
  assertEqual(s.towers.length, 1);
  assertEqual(s.towers[0].level, 3);
  assertEqual(s.wave.current, 8);
  assertEqual(s.tutorialSeen, true);
});

test('WHEN 通关 stage_2_10 AND 城主府≥3 → 解锁+Toast', function() {
  resetAll();
  clearEmitted();
  // Simulate unlock check
  TowerDefenseManager._checkUnlock();
  var unlockEvents = findEmitted('td:unlocked');
  assertEqual(unlockEvents.length, 1, '应触发 td:unlocked');
  assertEqual(TowerDefenseManager.getState().unlocked, true, '应已解锁');
});

test('WHEN 城主府<3 → 不解锁', function() {
  resetAll();
  TownManager._levels.town_hall = 2;
  clearEmitted();
  TowerDefenseManager._checkUnlock();
  assertEqual(TowerDefenseManager.getState().unlocked, false, '不应解锁');
  assertEqual(findEmitted('td:unlocked').length, 0, '不应触发事件');
});

test('WHEN 未通关 stage_2_10 → 不解锁', function() {
  resetAll();
  BattleManager._state.clearedStages = ['stage_1_10'];
  BattleManager._state.currentStage = 'stage_2_5';
  clearEmitted();
  TowerDefenseManager._checkUnlock();
  assertEqual(TowerDefenseManager.getState().unlocked, false, '不应解锁');
});

test('WHEN enterDefenseMode 未解锁 → false', function() {
  resetAll();
  var result = TowerDefenseManager.enterDefenseMode();
  assertEqual(result, false, '未解锁不能进入');
});

test('WHEN enterDefenseMode 已解锁 → 切换模式', function() {
  unlockTD();
  var result = TowerDefenseManager.enterDefenseMode();
  assert(result !== false, '应能进入防守模式');
  assert(TowerDefenseManager.isInDefenseMode(), '应在防守模式');
});

section('CAP-TD-02 建造防御塔');
// ========================

test('WHEN 建造箭塔于空闲格+资源足够 → 放置成功', function() {
  unlockTD();
  clearEmitted();
  var result = TowerDefenseManager.buildTower('td_arrow_tower', 5, 5);
  assert(result !== false && result.ok !== false, '建造应成功');
  var s = TowerDefenseManager.getState();
  assertEqual(s.towers.length, 1, '应有 1 座塔');
  assertEqual(s.towers[0].type, 'td_arrow_tower');
  assertEqual(s.towers[0].gridX, 5);
  assertEqual(s.towers[0].gridY, 5);
  var buildEvents = findEmitted('td:tower_built');
  assert(buildEvents.length >= 1, '应触发 td:tower_built');
});

test('WHEN 目标格已占用 → 拒绝', function() {
  unlockTD();
  TowerDefenseManager.buildTower('td_arrow_tower', 5, 5);
  var result = TowerDefenseManager.buildTower('td_palisade', 5, 5);
  assert(result === false || (result && result.ok === false), '应拒绝重复放置');
});

test('WHEN 资源不足 → 拒绝', function() {
  unlockTD();
  ResourceManager._resources.gold = 0;
  ResourceManager._resources.wood = 0;
  var result = TowerDefenseManager.buildTower('td_arrow_tower', 3, 3);
  assert(result === false || (result && result.ok === false), '资源不足应拒绝');
  ResourceManager._reset();
});

test('WHEN towers 已达上限 → 拒绝', function() {
  unlockTD();
  var max = TowerDefenseManager.getMaxTowers();
  for (var i = 0; i < max; i++) {
    TowerDefenseManager.buildTower('td_arrow_tower', i % 24, Math.floor(i / 24));
  }
  var result = TowerDefenseManager.buildTower('td_arrow_tower', 23, 23);
  assert(result === false || (result && result.ok === false), '超过上限应拒绝');
});

test('getMaxTowers = 8 + 城主府等级×3', function() {
  unlockTD();
  // town_hall level = 3
  assertEqual(TowerDefenseManager.getMaxTowers(), 8 + 3 * 3, 'Lv3: 17');
  TownManager._levels.town_hall = 5;
  assertEqual(TowerDefenseManager.getMaxTowers(), 8 + 5 * 3, 'Lv5: 23');
  TownManager._reset();
});

section('CAP-TD-03 升级防御塔');
// ========================

test('WHEN 升级 Lv1→Lv2 → ATK 倍率 1.20', function() {
  unlockTD();
  TowerDefenseManager.buildTower('td_arrow_tower', 5, 5);
  var tower = TowerDefenseManager.getState().towers[0];
  clearEmitted();
  var result = TowerDefenseManager.upgradeTower(tower.uid);
  assert(result !== false, '升级应成功');
  var updated = TowerDefenseManager.getState().towers[0];
  assertEqual(updated.level, 2, '等级应为 2');
  var upgradeEvents = findEmitted('td:tower_upgraded');
  assert(upgradeEvents.length >= 1, '应触发 td:tower_upgraded');
});

test('WHEN 塔已 Lv5 → 升级拒绝', function() {
  unlockTD();
  TowerDefenseManager.buildTower('td_arrow_tower', 5, 5);
  var tower = TowerDefenseManager.getState().towers[0];
  // Force to Lv5
  TowerDefenseManager._state.towers[0].level = 5;
  var result = TowerDefenseManager.upgradeTower(tower.uid);
  assert(result === false, 'Lv5 应拒绝升级');
});

// ========================
section('CAP-TD-04 出售防御塔');
// ========================

test('WHEN 非战斗出售 → 返还 50%', function() {
  unlockTD();
  ResourceManager._reset();
  var beforeGold = ResourceManager._resources.gold;
  TowerDefenseManager.buildTower('td_arrow_tower', 5, 5);
  var afterBuild = ResourceManager._resources.gold;
  var cost = beforeGold - afterBuild; // 花了多少金
  var tower = TowerDefenseManager.getState().towers[0];
  clearEmitted();
  TowerDefenseManager.sellTower(tower.uid);
  var afterSell = ResourceManager._resources.gold;
  var refund = afterSell - afterBuild;
  // 返还应为建造费的 50%（向下取整）
  var expectedRefund = Math.floor(TDTowerData.td_arrow_tower.cost.gold * 0.5);
  assertEqual(refund, expectedRefund, '返还金币应为 50%');
  assertEqual(TowerDefenseManager.getState().towers.length, 0, '塔应被移除');
  var sellEvents = findEmitted('td:tower_sold');
  assert(sellEvents.length >= 1, '应触发 td:tower_sold');
});

// ========================
section('CAP-TD-06 敌人行为 — 伤害公式');
// ========================

test('伤害公式: ATK × (1 - DEF/(DEF+100))', function() {
  // 箭塔 ATK=20 vs 步兵 DEF=8
  var dmg = 20 * (1 - 8 / (8 + 100));
  assertApprox(dmg, 18.52, 0.1, '箭塔 vs 步兵');
  // 火炮 ATK=60 vs 重步兵 DEF=26
  var dmg2 = 60 * (1 - 26 / (26 + 100));
  assertApprox(dmg2, 47.62, 0.1, '火炮 vs 重步兵');
});

section('CAP-TD-07 塔攻击 — getTowerStats');
// ========================

test('getTowerStats 返回含升级倍率的属性', function() {
  unlockTD();
  TowerDefenseManager.buildTower('td_arrow_tower', 5, 5);
  var tower = TowerDefenseManager.getState().towers[0];
  var stats = TowerDefenseManager.getTowerStats(tower.uid);
  assert(stats !== null, '应返回属性');
  assertEqual(stats.atk, 20, 'Lv1 ATK=20');
  // 升级到 Lv2
  TowerDefenseManager.upgradeTower(tower.uid);
  stats = TowerDefenseManager.getTowerStats(tower.uid);
  assertEqual(stats.atk, Math.floor(20 * 1.20), 'Lv2 ATK=24');
});

test('WHEN 派驻武将 → 加入 assignedHeroes', function() {

test('WHEN ATK=150 → 加成=15%', function() {
  unlockTD();
  HeroManager._heroes = [{ uid: 'h1', id: 'hero_1', atk: 150, def: 50, hp: 500, spd: 20 }];
  HeroManager._team = [];
  TowerDefenseManager.assignHero('h1');
  var bonus = TowerDefenseManager._calcHeroAtkBonus();
  assertEqual(bonus, 15, 'floor(150/10)=15');
});

test('WHEN 已有 2 名 → 新武将替换最后一名', function() {
  unlockTD();
  HeroManager._heroes = [
    { uid: 'h1', id: 'hero_1', atk: 100 },
    { uid: 'h2', id: 'hero_2', atk: 120 },
    { uid: 'h3', id: 'hero_3', atk: 140 }
  ];
  HeroManager._team = [];
  TowerDefenseManager.assignHero('h1');
  TowerDefenseManager.assignHero('h2');
  assertEqual(TowerDefenseManager.getState().assignedHeroes.length, 2);
  TowerDefenseManager.assignHero('h3');
  var heroes = TowerDefenseManager.getState().assignedHeroes;
  assertEqual(heroes.length, 2, '仍为 2 名');
  assert(heroes.indexOf('h3') !== -1, 'h3 应在列表中');
});

section('CAP-TD-11 科技研究');
// ========================

test('WHEN 研究时代2 且满足前置 → 扣资源+startTime', function() {
  unlockTD();
  TowerDefenseManager._state.wave.highest = 5;
  clearEmitted();
  var result = TowerDefenseManager.startResearch(2);
  assert(result !== false, '研究应启动');
  var s = TowerDefenseManager.getState();
  assert(s.research.era_2.startTime !== null, 'startTime 应设置');
  var events = findEmitted('td:research_started');
  assert(events.length >= 1, '应触发 td:research_started');
});

test('WHEN 未满足前置条件（波次不够）→ 拒绝', function() {
  unlockTD();
  TowerDefenseManager._state.wave.highest = 3; // 需要 5
  var result = TowerDefenseManager.startResearch(2);
  assert(result === false, '波次不够应拒绝');
});

test('canStartResearch 检查前置时代', function() {
  unlockTD();
  TowerDefenseManager._state.wave.highest = 10;
  // era 仍为 1，不能直接研究 era 3
  var can = TowerDefenseManager.canStartResearch(3);
  assert(can === false, '跳级应拒绝');
});

test('城主府 HP = 500 + 城主府等级 × 200', function() {

});

test('WHEN 旧存档无 towerDefense → 默认状态', function() {
  TowerDefenseManager.init({ resources: {}, heroes: {} });
  var s = TowerDefenseManager.getState();
  assertEqual(s.unlocked, false, '应为默认');
  assertEqual(s.era, 1, 'era=1');
});

test('WHEN 存档有部分字段缺失 → 补齐默认值', function() {
  TowerDefenseManager.init({ towerDefense: { unlocked: true, era: 2, towers: [] } });
  var s = TowerDefenseManager.getState();
  assertEqual(s.unlocked, true);
  assertEqual(s.era, 2);
  assert(s.wave !== undefined, 'wave 应存在');
  assert(s.stats !== undefined, 'stats 应存在');
  assert(s.assignedHeroes !== undefined, 'assignedHeroes 应存在');
});
