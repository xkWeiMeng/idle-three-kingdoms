  <!-- Row: 保存游戏 -->
  <line x1="10" y1="152" x2="380" y2="152" stroke="#0a1428" stroke-width="1"/>
  <text x="24" y="172" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#ccc">保存游戏</text>
  <text x="175" y="172" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#555">上次保存: 3分钟前</text>
  <rect x="308" y="160" width="62" height="24" rx="6" fill="#4caf50"/>
  <text x="339" y="177" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#fff">立即保存</text>
  <!-- Row: 导出存档 -->
  <line x1="10" y1="192" x2="380" y2="192" stroke="#0a1428" stroke-width="1"/>
  <text x="24" y="212" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#ccc">导出存档</text>
  <text x="175" y="212" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#555">复制存档字符串</text>
  <rect x="308" y="200" width="62" height="24" rx="6" fill="#0f3460" stroke="#1e5080" stroke-width="1"/>
  <text x="339" y="217" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#aaa">导出</text>
  <!-- Row: 导入存档 -->
  <line x1="10" y1="232" x2="380" y2="232" stroke="#0a1428" stroke-width="1"/>
  <text x="24" y="252" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#ccc">导入存档</text>
  <text x="175" y="252" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#555">粘贴存档字符串</text>
  <rect x="308" y="240" width="62" height="24" rx="6" fill="#0f3460" stroke="#1e5080" stroke-width="1"/>
  <text x="339" y="257" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#aaa">导入</text>
  <!-- Row: 删除存档 -->
  <line x1="10" y1="272" x2="380" y2="272" stroke="#0a1428" stroke-width="1"/>
  <text x="24" y="292" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#f44336">删除存档</text>
  <text x="175" y="292" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#555">清除所有游戏数据</text>
  <rect x="308" y="280" width="62" height="24" rx="6" fill="#2a0808" stroke="#f44336" stroke-width="1"/>
  <text x="339" y="297" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#f44336">删除</text>

  <!-- ══ GROUP 2: 游戏统计 ══ -->
  <rect x="10" y="332" width="370" height="180" rx="8" fill="#16213e" stroke="#0f3460" stroke-width="1"/>
  <rect x="10" y="332" width="370" height="34" rx="8" fill="#0f3460"/>
  <rect x="10" y="354" width="370" height="12" fill="#0f3460"/>
  <text x="24" y="354" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#eee">📊 游戏统计</text>
  <!-- 2×2 stat cards grid -->
  <!-- Card 1: 游戏时长 -->
  <rect x="18" y="374" width="164" height="60" rx="6" fill="#0d1b2a" stroke="#0f3460" stroke-width="1"/>
