  <rect x="10" y="118" width="370" height="200" rx="8" fill="#16213e" stroke="#0f3460" stroke-width="1"/>
  <!-- Group title bar -->
  <rect x="10" y="118" width="370" height="34" rx="8" fill="#0f3460"/>
  <rect x="10" y="140" width="370" height="12" fill="#0f3460"/>
