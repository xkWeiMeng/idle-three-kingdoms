  <text x="30" y="418" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="bold" fill="#f5c518">12</text>
  <text x="62" y="418" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#eee">小时 34 分</text>

  <!-- Card 2: 总战斗 -->
  <rect x="198" y="374" width="164" height="60" rx="6" fill="#0d1b2a" stroke="#0f3460" stroke-width="1"/>
  <text x="210" y="393" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#777">⚔️ 总战斗次数</text>
  <text x="210" y="418" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="bold" fill="#e94560">2,841</text>
  <text x="268" y="418" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#eee">次</text>

  <!-- Card 3: 最高通关 -->
  <rect x="18" y="442" width="164" height="60" rx="6" fill="#0d1b2a" stroke="#0f3460" stroke-width="1"/>
  <text x="30" y="461" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#777">🏆 最高通关</text>
  <text x="30" y="487" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="bold" fill="#4caf50">2-3</text>
  <text x="64" y="487" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#eee">章节</text>

  <!-- Card 4: 招募次数 -->
  <rect x="198" y="442" width="164" height="60" rx="6" fill="#0d1b2a" stroke="#0f3460" stroke-width="1"/>
  <text x="210" y="461" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#777">⭐ 招募次数</text>
  <text x="210" y="487" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="18" font-weight="bold" fill="#9c27b0">142</text>
  <text x="248" y="487" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" fill="#eee">次</text>

  <!-- ══ GROUP 3: 关于游戏 ══ -->
  <rect x="10" y="526" width="370" height="136" rx="8" fill="#16213e" stroke="#0f3460" stroke-width="1"/>
  <rect x="10" y="526" width="370" height="34" rx="8" fill="#0f3460"/>
  <rect x="10" y="548" width="370" height="12" fill="#0f3460"/>
  <text x="24" y="548" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#eee">ℹ️ 关于游戏</text>
  <!-- Game logo area -->
  <text x="195" y="590" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="bold" fill="#f5c518" letter-spacing="3">幻想三国</text>
  <text x="195" y="608" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#777">Idle Three Kingdoms · 三国放置策略游戏</text>
  <!-- Version row -->
  <line x1="20" y1="616" x2="370" y2="616" stroke="#0a1428" stroke-width="1"/>
  <text x="24" y="636" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#888">版本号</text>
  <text x="370" y="636" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#555">v0.1.0-alpha</text>
  <text x="24" y="654" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#888">开源协议</text>
  <text x="370" y="654" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#555">MIT License</text>
