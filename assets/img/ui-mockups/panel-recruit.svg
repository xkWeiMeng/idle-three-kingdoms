  <rect x="10" y="358" width="370" height="130" rx="8" fill="#16213e" stroke="#0f3460" stroke-width="1"/>
  <text x="20" y="378" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="bold" fill="#eee">保底进度</text>
  <text x="370" y="378" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#777">距下次保底</text>

  <!-- Pity row 1: 稀有 (2/10) blue -->
  <text x="20"  y="400" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#2196f3">🔵 稀有</text>
  <rect x="66"  y="392" width="240" height="10" rx="5" fill="#0a1828"/>
  <rect x="66"  y="392" width="48"  height="10" rx="5" fill="#2196f3"/>
  <text x="314" y="401" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#2196f3">2/10</text>
  <text x="370" y="401" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#555">8次后必得</text>

  <!-- Pity row 2: 史诗 (8/30) purple -->
  <text x="20"  y="426" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#9c27b0">🟣 史诗</text>
  <rect x="66"  y="418" width="240" height="10" rx="5" fill="#1a0830"/>
  <rect x="66"  y="418" width="64"  height="10" rx="5" fill="#9c27b0"/>
  <text x="314" y="427" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#9c27b0">8/30</text>
  <text x="370" y="427" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#555">22次后必得</text>

  <!-- Pity row 3: 传说 (42/80) orange -->
  <text x="20"  y="452" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#ff9800">🟠 传说</text>
  <rect x="66"  y="444" width="240" height="10" rx="5" fill="#1a0800"/>
  <rect x="66"  y="444" width="126" height="10" rx="5" fill="#ff9800"/>
  <text x="314" y="453" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#ff9800">42/80</text>
  <text x="370" y="453" text-anchor="end" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#ff9800">38次后必得!</text>

  <!-- History hint -->
  <line x1="20" y1="465" x2="370" y2="465" stroke="#0f3460" stroke-width="1"/>
  <text x="195" y="478" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#555">累计招募 142 次 · 上次传说: 曹操 (40次前)</text>

  <!-- ── Recruit buttons ── -->
  <!-- Single recruit -->
  <rect x="10"  y="500" width="178" height="52" rx="10" fill="#16213e" stroke="#f5c518" stroke-width="2"/>
  <text x="99"  y="522" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#eee">单抽</text>
  <text x="99"  y="543" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#f5c518">💎 × 100</text>

  <!-- Ten pull -->
  <rect x="202" y="500" width="178" height="52" rx="10" fill="url(#goldBtn)" stroke="#f5c518" stroke-width="1"/>
  <text x="291" y="522" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e">十连抽</text>
  <text x="291" y="543" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#1a1a2e">💎 × 900</text>

  <!-- Discount badge on ten-pull -->
  <rect x="320" y="496" width="50" height="16" rx="8" fill="#e94560"/>
  <text x="345" y="508" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#fff">省💎×100</text>

  <!-- Hint text -->
  <text x="195" y="574" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#555">十连抽必出一名稀有或以上品质武将</text>
</svg>
