  <rect x="14" y="122" width="14" height="2" fill="#f5c518" opacity="0.5"/>
  <rect x="14" y="122" width="2"  height="14" fill="#f5c518" opacity="0.5"/>
  <rect x="362" y="122" width="14" height="2" fill="#f5c518" opacity="0.5"/>
  <rect x="374" y="122" width="2"  height="14" fill="#f5c518" opacity="0.5"/>
  <rect x="14"  y="336" width="14" height="2" fill="#f5c518" opacity="0.5"/>
  <rect x="14"  y="322" width="2"  height="14" fill="#f5c518" opacity="0.5"/>
  <rect x="362" y="336" width="14" height="2" fill="#f5c518" opacity="0.5"/>
  <rect x="374" y="322" width="2"  height="14" fill="#f5c518" opacity="0.5"/>

