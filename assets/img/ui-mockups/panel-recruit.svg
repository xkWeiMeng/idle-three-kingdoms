<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="720" viewBox="0 0 390 720">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="recruitBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="50%" stop-color="#0d1b3a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="goldBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#d4a800"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9c27b0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9c27b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="720" fill="#1a1a2e"/>

  <!-- ═══ HEADER ═══ -->
  <rect width="390" height="68" fill="url(#hg)"/>
  <rect y="67" width="390" height="1" fill="#0f3460"/>
  <rect x="172" y="0" width="46" height="3" fill="#f5c518" opacity="0.6"/>
  <text x="195" y="26" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="19" font-weight="bold" fill="#f5c518" letter-spacing="3">幻想三国</text>
  <text x="195" y="41" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#777">三国放置策略游戏</text>
  <rect x="6"   y="51" width="82" height="14" rx="7" fill="#0f3460" opacity="0.8"/>
  <text x="47"  y="62" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#f5c518">💰 12,345</text>
  <rect x="94"  y="51" width="58" height="14" rx="7" fill="#0f3460" opacity="0.8"/>
  <text x="123" y="62" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#eee">💎 88</text>
  <rect x="158" y="51" width="68" height="14" rx="7" fill="#0f3460" opacity="0.8"/>
  <text x="192" y="62" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#eee">🍚 4,200</text>
  <rect x="232" y="51" width="68" height="14" rx="7" fill="#0f3460" opacity="0.8"/>
  <text x="266" y="62" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#eee">⭐ 3,600</text>

  <!-- ═══ TAB BAR ═══ -->
  <rect y="68" width="390" height="44" fill="#0d1b2a"/>
  <!-- Active: 招募 (tab 3, x=195) -->
  <rect y="68" x="195" width="65" height="44" fill="#16213e"/>
  <rect y="109" x="195" width="65" height="3" fill="#f5c518"/>
  <text x="32"  y="94" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#555">⚔️ 武将</text>
  <text x="97"  y="94" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#555">🏟️ 战斗</text>
  <text x="162" y="94" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#555">📖 剧情</text>
  <text x="227" y="94" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#f5c518">⭐ 招募</text>
  <text x="292" y="94" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#555">🗡️ 装备</text>
  <text x="357" y="94" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="10" fill="#555">⚙️ 设置</text>
  <line x1="65"  y1="73" x2="65"  y2="108" stroke="#0f3460" stroke-width="1"/>
  <line x1="130" y1="73" x2="130" y2="108" stroke="#0f3460" stroke-width="1"/>
  <line x1="195" y1="73" x2="195" y2="108" stroke="#0f3460" stroke-width="1"/>
  <line x1="260" y1="73" x2="260" y2="108" stroke="#0f3460" stroke-width="1"/>
  <line x1="325" y1="73" x2="325" y2="108" stroke="#0f3460" stroke-width="1"/>

  <!-- ═══ CONTENT ═══ -->

  <!-- ── Large recruit display area ── -->
  <rect x="10" y="118" width="370" height="230" rx="10" fill="url(#recruitBg)" stroke="#9c27b0" stroke-width="1.5"/>
  <!-- Decorative border top -->
  <rect x="10" y="118" width="370" height="3" rx="1" fill="#9c27b0" opacity="0.5"/>
  <!-- Background glow effect -->
  <ellipse cx="195" cy="233" rx="120" ry="80" fill="url(#glowPurple)"/>
  <!-- Decorative stars -->
  <text x="40"  y="170" font-size="14" font-family="sans-serif" fill="#f5c518" opacity="0.5">✦</text>
  <text x="340" y="165" font-size="10" font-family="sans-serif" fill="#f5c518" opacity="0.4">✦</text>
  <text x="60"  y="310" font-size="10" font-family="sans-serif" fill="#9c27b0" opacity="0.5">✦</text>
  <text x="330" y="315" font-size="14" font-family="sans-serif" fill="#9c27b0" opacity="0.4">✦</text>
  <!-- Hall name -->
  <text x="195" y="148" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#888">🏛️ 招贤馆</text>
  <!-- Decorative divider -->
  <line x1="80" y1="155" x2="145" y2="155" stroke="#9c27b0" stroke-width="1" opacity="0.5"/>
  <text x="195" y="160" text-anchor="middle" font-size="8" font-family="sans-serif" fill="#9c27b0" opacity="0.7">◆</text>
  <line x1="245" y1="155" x2="310" y2="155" stroke="#9c27b0" stroke-width="1" opacity="0.5"/>
  <!-- Main recruit icon -->
  <circle cx="195" cy="225" r="62" fill="#1a0830" opacity="0.8"/>
  <circle cx="195" cy="225" r="62" fill="none" stroke="#9c27b0" stroke-width="2" opacity="0.8"/>
  <circle cx="195" cy="225" r="50" fill="none" stroke="#9c27b0" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <text x="195" y="245" text-anchor="middle" font-size="60" font-family="sans-serif" opacity="0.9">🏛️</text>
  <!-- "Tap to recruit" hint -->
  <text x="195" y="308" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="11" fill="#888">点击招募按钮开始抽取</text>
  <!-- Rarity chances hint -->
  <text x="80"  y="326" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#4caf50">稀有 45%</text>
  <text x="195" y="326" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#2196f3">史诗 12%</text>
  <text x="310" y="326" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="9" fill="#9c27b0">传说 3%</text>
